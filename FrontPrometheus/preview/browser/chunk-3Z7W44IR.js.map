<app-modal-formulario titulo="Cargar Moneda" subtitulo="Registre una moneda para usarla en instrumentos y reportes." accion="Registrar"
    [faltantes]="faltantes" [datos]="nuevoRegistro" [guardando]="guardando" (cerrar)="cerrar()" (guardar)="registrar()">

    <fieldset class="hig-seccion">
        <legend>Identificación</legend>
        <div class="hig-cuadricula hig-columnas-3">
            <div class="hig-campo">
                <label class="form-label" for="mo-c-codMoneda">Código<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="mo-c-codMoneda" type="text" class="form-control" autocomplete="off" placeholder="Ej. PEN" minlength="3" maxlength="3" [(ngModel)]="nuevoRegistro.codMoneda" required>
            </div>
            <div class="hig-campo">
                <label class="form-label" for="mo-c-desMoneda">Descripción<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="mo-c-desMoneda" type="text" class="form-control" autocomplete="off" placeholder="Ej. Sol Peruano" minlength="2" maxlength="60" [(ngModel)]="nuevoRegistro.desMoneda" required>
            </div>
            <div class="hig-campo">
                <label class="form-label" for="mo-c-desCorto">Descripción Corta</label>
                <input id="mo-c-desCorto" type="text" class="form-control" autocomplete="off" placeholder="Ej. Sol" minlength="3" maxlength="3" [(ngModel)]="nuevoRegistro.desCorto">
            </div>
            <div class="hig-campo">
                <label class="form-label" for="mo-c-codSucave">Cód. Sucave</label>
                <input id="mo-c-codSucave" type="text" class="form-control" autocomplete="off" placeholder="Ej. 0001" minlength="4" maxlength="4" [(ngModel)]="nuevoRegistro.codSucave">
            </div>
        </div>
    </fieldset>

    <fieldset class="hig-seccion">
        <legend>Equivalencias</legend>
        <div class="hig-cuadricula hig-columnas-3">
            <div class="hig-campo">
                <label class="form-label" for="mo-c-codTipoRelacionUSD">
                    Relación USD
                    <i class="bi bi-info-circle-fill text-primary ms-2" data-bs-toggle="tooltip" data-bs-html="true"
                        data-bs-placement="right" title="Ingrese la letra D (Directo) o I (Indirecto)"></i>
                </label>
                <input id="mo-c-codTipoRelacionUSD" type="text" class="form-control" autocomplete="off" placeholder="D o I" minlength="1" maxlength="1"
                    [(ngModel)]="nuevoRegistro.codTipoRelacionUSD" (keydown)="permitirSoloDoI($event)">
            </div>
            <div class="hig-campo">
                <label class="form-label" for="mo-c-codMonedaInt">Cód. Moneda Int.</label>
                <input id="mo-c-codMonedaInt" type="text" class="form-control" autocomplete="off" placeholder="Ej. USD" minlength="4" maxlength="4" [(ngModel)]="nuevoRegistro.codMonedaInt">
            </div>
            <div class="hig-campo">
                <label class="form-label" for="mo-c-desTicker">Ticker</label>
                <input id="mo-c-desTicker" type="text" class="form-control" autocomplete="off" placeholder="Ej. PEN Curncy" minlength="3" maxlength="20" [(ngModel)]="nuevoRegistro.desTicker">
            </div>
        </div>
    </fieldset>

    <fieldset class="hig-seccion">
        <legend>Opciones</legend>
        <div class="hig-cuadricula hig-columnas-1">
            <div class="hig-opcion">
                <input class="form-check-input" type="checkbox" id="mo-c-flgCargaAutom" [(ngModel)]="nuevoRegistro.flgCargaAutom">
                <div>
                    <label class="hig-opcion__titulo" for="mo-c-flgCargaAutom">Carga automática</label>
                    <span class="hig-opcion__ayuda">El tipo de cambio se actualiza automáticamente desde la fuente de información.</span>
                </div>
            </div>
            <div class="hig-opcion">
                <input class="form-check-input" type="checkbox" id="mo-c-flgVaR" [(ngModel)]="nuevoRegistro.flgVaR">
                <div>
                    <label class="hig-opcion__titulo" for="mo-c-flgVaR">Cálculo de VaR</label>
                    <span class="hig-opcion__ayuda">Habilita esta moneda como moneda de reporte en el cálculo de Valor en Riesgo.</span>
                </div>
            </div>
        </div>
    </fieldset>

</app-modal-formulario>
