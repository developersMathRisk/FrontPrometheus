<app-modal-formulario titulo="Cargar Fuente de Información" subtitulo="Registre una fuente de información para asociarla a instrumentos y precios." accion="Registrar"
    [faltantes]="faltantes" [datos]="nuevoRegistro" [guardando]="guardando" (cerrar)="cerrar()" (guardar)="registrar()">

    <fieldset class="hig-seccion">
        <legend>Identificación</legend>
        <div class="hig-cuadricula">
            <div class="hig-campo">
                <label class="form-label" for="fi-c-codFuenteInformacion">Código<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="fi-c-codFuenteInformacion" type="text" class="form-control" autocomplete="off" placeholder="Código" minlength="1" maxlength="6" [(ngModel)]="nuevoRegistro.codFuenteInformacion" required>
            </div>
            <div class="hig-campo">
                <label class="form-label" for="fi-c-desFuenteInformacion">Descripción<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="fi-c-desFuenteInformacion" type="text" class="form-control" autocomplete="off" placeholder="Descripción" minlength="1" maxlength="60" [(ngModel)]="nuevoRegistro.desFuenteInformacion" required>
            </div>
        </div>
    </fieldset>

</app-modal-formulario>
