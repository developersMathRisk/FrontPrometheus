<app-modal-formulario titulo="Cargar Tipo de Instrumento" subtitulo="Registre un tipo de instrumento para clasificar los productos financieros del sistema." accion="Registrar"
    [faltantes]="faltantes" [datos]="nuevoRegistro" [guardando]="guardando" (cerrar)="cerrar()" (guardar)="registrar()">

    <fieldset class="hig-seccion">
        <legend>Identificación</legend>
        <div class="hig-cuadricula">
            <div class="hig-campo">
                <label class="form-label" for="ti-c-codTipoInstrumento">Código<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="ti-c-codTipoInstrumento" type="text" class="form-control" autocomplete="off" placeholder="Código" minlength="2" maxlength="20" [(ngModel)]="nuevoRegistro.codTipoInstrumento" required>
            </div>
            <div class="hig-campo">
                <label class="form-label" for="ti-c-descripcionTipoInstrumento">Descripción<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="ti-c-descripcionTipoInstrumento" type="text" class="form-control" autocomplete="off" placeholder="Descripción" minlength="3" maxlength="100" [(ngModel)]="nuevoRegistro.descripcionTipoInstrumento" required>
            </div>
        </div>
    </fieldset>

</app-modal-formulario>
