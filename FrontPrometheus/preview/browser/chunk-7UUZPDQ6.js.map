<app-modal-formulario titulo="Cargar País" subtitulo="Registre un país para clasificar corporaciones y otros catálogos." accion="Registrar"
    [faltantes]="faltantes" [datos]="nuevoRegistro" [guardando]="guardando" (cerrar)="cerrar()" (guardar)="registrar()">

    <fieldset class="hig-seccion">
        <legend>Identificación</legend>
        <div class="hig-cuadricula hig-columnas-3">
            <div class="hig-campo">
                <label class="form-label" for="pa-c-codPais">Código<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="pa-c-codPais" type="text" class="form-control" autocomplete="off" placeholder="Ej. PE" minlength="2" maxlength="2" [(ngModel)]="nuevoRegistro.codPais" required>
            </div>
            <div class="hig-campo">
                <label class="form-label" for="pa-c-desPais">Descripción<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="pa-c-desPais" type="text" class="form-control" autocomplete="off" placeholder="Ej. Perú" minlength="2" maxlength="60" [(ngModel)]="nuevoRegistro.desPais" required>
            </div>
            <div class="hig-campo">
                <label class="form-label" for="pa-c-abrev">Abreviatura</label>
                <input id="pa-c-abrev" type="text" class="form-control" autocomplete="off" placeholder="Ej. PER" minlength="2" maxlength="10" [(ngModel)]="nuevoRegistro.abrev">
            </div>
        </div>
    </fieldset>

</app-modal-formulario>
