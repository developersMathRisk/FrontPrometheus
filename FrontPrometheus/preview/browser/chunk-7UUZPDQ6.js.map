<app-modal-formulario titulo="Cargar Plaza" subtitulo="Registre una plaza bursátil para asociarla a instrumentos." accion="Registrar"
    [faltantes]="faltantes" [datos]="nuevoRegistro" [guardando]="guardando" (cerrar)="cerrar()" (guardar)="registrar()">

    <fieldset class="hig-seccion">
        <legend>Identificación</legend>
        <div class="hig-cuadricula">
            <div class="hig-campo">
                <label class="form-label" for="pl-c-codPlaza">Código<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="pl-c-codPlaza" type="text" class="form-control" autocomplete="off" placeholder="Código" minlength="1" maxlength="6" [(ngModel)]="nuevoRegistro.codPlaza" required>
            </div>
            <div class="hig-campo">
                <label class="form-label" for="pl-c-desPlaza">Descripción<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="pl-c-desPlaza" type="text" class="form-control" autocomplete="off" placeholder="Descripción" minlength="1" maxlength="60" [(ngModel)]="nuevoRegistro.desPlaza" required>
            </div>
        </div>
    </fieldset>

</app-modal-formulario>
