<app-modal-formulario titulo="Cargar Frecuencia de Pago" subtitulo="Registre una frecuencia de pago para usarla en el calendario de cupones de instrumentos de renta fija." accion="Registrar"
    [faltantes]="faltantes" [datos]="nuevoRegistro" [guardando]="guardando" (cerrar)="cerrar()" (guardar)="registrar()">

    <fieldset class="hig-seccion">
        <legend>Identificación</legend>
        <div class="hig-cuadricula">
            <div class="hig-campo">
                <label class="form-label" for="fp-c-nombreFrecuencia">Nombre<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="fp-c-nombreFrecuencia" type="text" class="form-control" autocomplete="off" placeholder="Ej. Mensual" minlength="3" maxlength="50" [(ngModel)]="nuevoRegistro.nombreFrecuencia" required>
            </div>
            <div class="hig-campo">
                <label class="form-label" for="fp-c-descripcionFrecuencia">Descripción</label>
                <input id="fp-c-descripcionFrecuencia" type="text" class="form-control" autocomplete="off" placeholder="Ej. Pago una vez al mes" minlength="3" maxlength="500" [(ngModel)]="nuevoRegistro.descripcionFrecuencia">
            </div>
        </div>
    </fieldset>

</app-modal-formulario>
