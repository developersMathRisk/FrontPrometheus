<app-modal-formulario titulo="Cargar Tipo Acción" subtitulo="Registre un tipo de acción para clasificar instrumentos de renta variable." accion="Registrar"
    [faltantes]="faltantes" [datos]="nuevoRegistro" [guardando]="guardando" (cerrar)="cerrar()" (guardar)="registrar()">

    <fieldset class="hig-seccion">
        <legend>Identificación</legend>
        <div class="hig-cuadricula hig-columnas-3">
            <div class="hig-campo">
                <label class="form-label" for="ta-c-codTipoAccion">Código<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="ta-c-codTipoAccion" type="text" class="form-control" autocomplete="off" placeholder="Código" minlength="1" maxlength="6" [(ngModel)]="nuevoRegistro.codTipoAccion" required>
            </div>
            <div class="hig-campo">
                <label class="form-label" for="ta-c-desTipoAccion">Descripción<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="ta-c-desTipoAccion" type="text" class="form-control" autocomplete="off" placeholder="Descripción" minlength="1" maxlength="60" [(ngModel)]="nuevoRegistro.desTipoAccion" required>
            </div>
        </div>
    </fieldset>

</app-modal-formulario>
