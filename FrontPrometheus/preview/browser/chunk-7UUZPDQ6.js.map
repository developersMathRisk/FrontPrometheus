<app-modal-formulario titulo="Cargar Tipo de Fondo" subtitulo="Registre un tipo de fondo para clasificar los fondos de inversión administrados." accion="Registrar"
    [faltantes]="faltantes" [datos]="nuevoRegistro" [guardando]="guardando" (cerrar)="cerrar()" (guardar)="registrar()">

    <fieldset class="hig-seccion">
        <legend>Identificación</legend>
        <div class="hig-cuadricula">
            <div class="hig-campo">
                <label class="form-label" for="tf-c-codTipoFondo">Código<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="tf-c-codTipoFondo" type="text" class="form-control" autocomplete="off" placeholder="Código" minlength="3" maxlength="3" [(ngModel)]="nuevoRegistro.codTipoFondo" required>
            </div>
            <div class="hig-campo">
                <label class="form-label" for="tf-c-desTipoFondo">Descripción<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="tf-c-desTipoFondo" type="text" class="form-control" autocomplete="off" placeholder="Descripción" minlength="3" maxlength="150" [(ngModel)]="nuevoRegistro.desTipoFondo" required>
            </div>
        </div>
    </fieldset>

</app-modal-formulario>
