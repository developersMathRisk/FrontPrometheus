<app-modal-formulario titulo="Cargar Tipo Sector" subtitulo="Registre un tipo de sector para clasificar instrumentos según su rubro económico." accion="Registrar"
    [faltantes]="faltantes" [datos]="nuevoRegistro" [guardando]="guardando" (cerrar)="cerrar()" (guardar)="registrar()">

    <fieldset class="hig-seccion">
        <legend>Identificación</legend>
        <div class="hig-cuadricula">
            <div class="hig-campo">
                <label class="form-label" for="ts-c-codTiposector">Código<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="ts-c-codTiposector" type="text" class="form-control" autocomplete="off" placeholder="Código" minlength="2" maxlength="20" [(ngModel)]="nuevoRegistro.codTiposector" required>
            </div>
            <div class="hig-campo">
                <label class="form-label" for="ts-c-descripcionTiposector">Descripción<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="ts-c-descripcionTiposector" type="text" class="form-control" autocomplete="off" placeholder="Descripción" minlength="3" maxlength="100" [(ngModel)]="nuevoRegistro.descripcionTiposector" required>
            </div>
        </div>
    </fieldset>

</app-modal-formulario>
