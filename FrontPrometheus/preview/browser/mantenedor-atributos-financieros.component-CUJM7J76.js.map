<app-modal-formulario titulo="Editar Tipo Sector" subtitulo="Modifique los datos del tipo de sector." accion="Guardar Cambios"
    [faltantes]="faltantes" [datos]="objRegistroEditado" [guardando]="guardando" (cerrar)="cerrar()" (guardar)="guardarCambios()">

    <fieldset class="hig-seccion">
        <legend>Identificación</legend>
        <div class="hig-cuadricula">
            <div class="hig-campo">
                <label class="form-label" for="ts-e-codTiposector">Código<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="ts-e-codTiposector" type="text" class="form-control" autocomplete="off" minlength="1" maxlength="6" [(ngModel)]="objRegistroEditado.codTiposector" required>
            </div>
            <div class="hig-campo">
                <label class="form-label" for="ts-e-descripcionTiposector">Descripción<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="ts-e-descripcionTiposector" type="text" class="form-control" autocomplete="off" minlength="1" maxlength="60" [(ngModel)]="objRegistroEditado.descripcionTiposector" required>
            </div>
        </div>
    </fieldset>

</app-modal-formulario>
