<app-modal-formulario titulo="Editar Grupo Económico" subtitulo="Modifique los datos del grupo económico." accion="Guardar Cambios"
    [faltantes]="faltantes" [datos]="objRegistroEditado" [guardando]="guardando" (cerrar)="cerrar()" (guardar)="guardarCambios()">

    <fieldset class="hig-seccion">
        <legend>Identificación</legend>
        <div class="hig-cuadricula hig-columnas-3">
            <div class="hig-campo">
                <label class="form-label" for="ge-e-nombreGrupo">Nombre<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="ge-e-nombreGrupo" type="text" class="form-control" autocomplete="off" minlength="3" maxlength="100" [(ngModel)]="objRegistroEditado.nombreGrupo" required>
            </div>
            <div class="hig-campo">
                <label class="form-label" for="ge-e-descripcion">Descripción<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="ge-e-descripcion" type="text" class="form-control" autocomplete="off" minlength="3" maxlength="500" [(ngModel)]="objRegistroEditado.descripcion" required>
            </div>
        </div>
    </fieldset>

</app-modal-formulario>
