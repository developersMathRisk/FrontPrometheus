<app-modal-formulario titulo="Editar Fuente de Información" subtitulo="Modifique los datos de la fuente de información." accion="Guardar Cambios"
    [faltantes]="faltantes" [datos]="objRegistroEditado" [guardando]="guardando" (cerrar)="cerrar()" (guardar)="guardarCambios()">

    <fieldset class="hig-seccion">
        <legend>Identificación</legend>
        <div class="hig-cuadricula">
            <div class="hig-campo">
                <label class="form-label" for="fi-e-codFuenteInformacion">Código<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="fi-e-codFuenteInformacion" type="text" class="form-control" autocomplete="off" minlength="1" maxlength="6" [(ngModel)]="objRegistroEditado.codFuenteInformacion" required>
            </div>
            <div class="hig-campo">
                <label class="form-label" for="fi-e-desFuenteInformacion">Descripción<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="fi-e-desFuenteInformacion" type="text" class="form-control" autocomplete="off" minlength="1" maxlength="60" [(ngModel)]="objRegistroEditado.desFuenteInformacion" required>
            </div>
        </div>
    </fieldset>

</app-modal-formulario>
