<app-modal-formulario titulo="Cargar Corporación" subtitulo="Registre una corporación para agrupar sus subsidiarias." accion="Registrar"
    [faltantes]="faltantes" [datos]="nuevoRegistro" [guardando]="guardando" (cerrar)="cerrar()" (guardar)="registrar()">

    <fieldset class="hig-seccion">
        <legend>Identificación</legend>
        <div class="hig-cuadricula">
            <div class="hig-campo">
                <label class="form-label" for="co-c-descripcion">Descripción<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="co-c-descripcion" type="text" class="form-control" autocomplete="off" placeholder="Descripción" minlength="2" maxlength="100" [(ngModel)]="nuevoRegistro.descripcion" required>
            </div>
            <div class="hig-campo">
                <label class="form-label" for="co-c-abrev">Abreviatura</label>
                <input id="co-c-abrev" type="text" class="form-control" autocomplete="off" placeholder="Abreviatura" minlength="2" maxlength="10" [(ngModel)]="nuevoRegistro.abrev">
            </div>
        </div>
    </fieldset>

    <fieldset class="hig-seccion">
        <legend>Clasificación</legend>
        <div class="hig-cuadricula">
            <div class="hig-campo">
                <label class="form-label" for="co-c-pais">País</label>
                <div class="combo-contenedor">
                    <ng-select labelForId="co-c-pais" placeholder="Seleccione una opción…" [items]="listPais" bindLabel="desPais" bindValue="idPais" [(ngModel)]="nuevoRegistro.pais"></ng-select>
                    <button type="button" class="btn btn-outline-primary btn-wave btn-agregar" title="Agregar país" aria-label="Agregar país" (click)="abrirModalSecundario(cargaModalPais)"><span class="icon" aria-hidden="true">+</span></button>
                </div>
            </div>
        </div>
    </fieldset>

</app-modal-formulario>

<ng-template #cargaModalPais let-modal>
    <app-carga-pais (close)="cerrarModalSecundario($event)"></app-carga-pais>
</ng-template>
