<app-modal-formulario titulo="Cargar Tipo de Emisión" subtitulo="Registre un tipo de emisión para clasificar instrumentos de renta fija." accion="Registrar"
    [faltantes]="faltantes" [datos]="nuevoRegistro" [guardando]="guardando" (cerrar)="cerrar()" (guardar)="registrar()">

    <fieldset class="hig-seccion">
        <legend>Identificación</legend>
        <div class="hig-cuadricula hig-columnas-3">
            <div class="hig-campo">
                <label class="form-label" for="te-c-nombreEmision">Nombre<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="te-c-nombreEmision" type="text" class="form-control" autocomplete="off" placeholder="Nombre" minlength="3" maxlength="100" [(ngModel)]="nuevoRegistro.nombreEmision" required>
            </div>
            <div class="hig-campo">
                <label class="form-label" for="te-c-nombreCorto">Nombre Corto</label>
                <input id="te-c-nombreCorto" type="text" class="form-control" autocomplete="off" placeholder="Nombre Corto" minlength="3" maxlength="10" [(ngModel)]="nuevoRegistro.nombreCorto">
            </div>
            <div class="hig-campo">
                <label class="form-label" for="te-c-descripcion">Descripción<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="te-c-descripcion" type="text" class="form-control" autocomplete="off" placeholder="Descripción" minlength="3" maxlength="500" [(ngModel)]="nuevoRegistro.descripcion" required>
            </div>
        </div>
    </fieldset>

</app-modal-formulario>
