<app-modal-formulario titulo="Cargar Subsidiaria" subtitulo="Registre una subsidiaria para asociarla a su corporación y moneda funcional." accion="Registrar"
    [faltantes]="faltantes" [datos]="nuevoRegistro" [guardando]="guardando" (cerrar)="cerrar()" (guardar)="registrar()">

    <fieldset class="hig-seccion">
        <legend>Identificación</legend>
        <div class="hig-cuadricula hig-columnas-3">
            <div class="hig-campo">
                <label class="form-label" for="su-c-codCorp">Corporación<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="su-c-codCorp" type="text" class="form-control" autocomplete="off" placeholder="Código" minlength="3" maxlength="20" [(ngModel)]="nuevoRegistro.codCorp" required>
            </div>
            <div class="hig-campo">
                <label class="form-label" for="su-c-descSubsidiaria">Descripción<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="su-c-descSubsidiaria" type="text" class="form-control" autocomplete="off" placeholder="Descripción" minlength="3" maxlength="20" [(ngModel)]="nuevoRegistro.descSubsidiaria" required>
            </div>
            <div class="hig-campo">
                <label class="form-label" for="su-c-codMonedaFunc">Moneda Funcional</label>
                <input id="su-c-codMonedaFunc" type="text" class="form-control" autocomplete="off" placeholder="Descripción" minlength="3" maxlength="20" [(ngModel)]="nuevoRegistro.codMonedaFunc">
            </div>
        </div>
    </fieldset>

</app-modal-formulario>
