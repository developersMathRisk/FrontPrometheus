<app-modal-formulario titulo="Editar Plaza" subtitulo="Modifique los datos de la plaza." accion="Guardar Cambios"
    [faltantes]="faltantes" [datos]="objRegistroEditado" [guardando]="guardando" (cerrar)="cerrar()" (guardar)="guardarCambios()">

    <fieldset class="hig-seccion">
        <legend>Identificación</legend>
        <div class="hig-cuadricula">
            <div class="hig-campo">
                <label class="form-label" for="pl-e-codPlaza">Código<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="pl-e-codPlaza" type="text" class="form-control" autocomplete="off" minlength="1" maxlength="6" [(ngModel)]="objRegistroEditado.codPlaza" required>
            </div>
            <div class="hig-campo">
                <label class="form-label" for="pl-e-desPlaza">Descripción<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="pl-e-desPlaza" type="text" class="form-control" autocomplete="off" minlength="1" maxlength="60" [(ngModel)]="objRegistroEditado.desPlaza" required>
            </div>
        </div>
    </fieldset>

</app-modal-formulario>
