<div class="hig-tabla">

    <app-tabla-toolbar placeholder="Buscar corporación o descripción…" accion="Agregar Subsidiaria"
        [total]="total" [filtrados]="filtrados" [ocultarResumen]="cargando || !!mensajeError" [texto]="busqueda"
        (buscar)="buscar($event)" (agregar)="registrar(cargaModal)">
    </app-tabla-toolbar>

    <div class="tabla-contenedor">
        <table mat-table [dataSource]="dataSource" matSort #sort="matSort" matSortActive="descripcion"
            matSortDirection="asc" aria-label="Listado de subsidiarias">

            <ng-container matColumnDef="id">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
                <td mat-cell *matCellDef="let element" class="col-id">{{ element.idSubsidiaria }}</td>
            </ng-container>

            <ng-container matColumnDef="codCorp">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Cod. Corporación</th>
                <td mat-cell *matCellDef="let element"><span class="fw-semibold">{{ element.codCorp }}</span></td>
            </ng-container>

            <ng-container matColumnDef="descripcion">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Descripción</th>
                <td mat-cell *matCellDef="let element">{{ element.descSubsidiaria }}</td>
            </ng-container>

            <ng-container matColumnDef="codMonedaFunc">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Cod. Moneda Funcional</th>
                <td mat-cell *matCellDef="let element" [class.celda-vacia]="!element.codMonedaFunc">{{ element.codMonedaFunc || '—' }}</td>
            </ng-container>

            <ng-container matColumnDef="acciones" stickyEnd>
                <th mat-header-cell *matHeaderCellDef class="col-acciones"><span class="solo-lector">Acciones</span></th>
                <td mat-cell *matCellDef="let element" class="col-acciones">
                    <button type="button" class="btn-fila" aria-label="Acciones del registro"
                        (click)="abrirMenuFila($event, element)">
                        <mat-icon aria-hidden="true">more_horiz</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;" (contextmenu)="onContextMenu($event, row)"></tr>
        </table>

        <app-tabla-estado [estado]="estadoTabla" tituloVacio="No hay subsidiarias registradas"
            detalleVacio="Agregue la primera con el botón «Agregar Subsidiaria»." [busqueda]="busqueda"
            [mensajeError]="mensajeError" (reintentar)="listarRegistros()" (limpiar)="buscar('')"></app-tabla-estado>
    </div>

    <mat-paginator #paginator [pageSizeOptions]="[10, 20, 50, 100]" [pageSize]="20" showFirstLastButtons
        [style.display]="estadoTabla ? 'none' : null" aria-label="Paginación de subsidiarias">
    </mat-paginator>
</div>

<div style="visibility: hidden; position: fixed"
    [style.left]="contextMenuPosition.x"
    [style.top]="contextMenuPosition.y"
    [matMenuTriggerFor]="contextMenu">
</div>

<mat-menu #contextMenu="matMenu">
    <ng-template matMenuContent let-item="item">
        <button mat-menu-item (click)="editar(selectedRow, editarModal)">
            <mat-icon>edit</mat-icon> Editar
        </button>
        <button mat-menu-item (click)="eliminar(selectedRow)">
            <mat-icon>delete</mat-icon> Eliminar
        </button>
    </ng-template>
</mat-menu>

<ng-template #cargaModal let-modal>
    <app-carga-subsidiaria (close)="cerrarModal($event)"></app-carga-subsidiaria>
</ng-template>

<ng-template #editarModal let-modal>
    <app-editar-subsidiaria (close)="cerrarModal($event)" [data]="filaEditar"></app-editar-subsidiaria>
</ng-template>
