<app-modal-formulario titulo="Editar Sector" subtitulo="Modifique los datos del sector." accion="Guardar Cambios"
    [faltantes]="faltantes" [datos]="objRegistroEditado" [guardando]="guardando" (cerrar)="cerrar()" (guardar)="guardarCambios()">

    <fieldset class="hig-seccion">
        <legend>Identificación</legend>
        <div class="hig-cuadricula">
            <div class="hig-campo">
                <label class="form-label" for="se-e-nombreSector">Nombre<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="se-e-nombreSector" type="text" class="form-control" autocomplete="off" minlength="3" maxlength="100" [(ngModel)]="objRegistroEditado.nombreSector" required>
            </div>
            <div class="hig-campo">
                <label class="form-label" for="se-e-descripcion">Descripción<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="se-e-descripcion" type="text" class="form-control" autocomplete="off" minlength="3" maxlength="500" [(ngModel)]="objRegistroEditado.descripcion" required>
            </div>
        </div>
    </fieldset>

</app-modal-formulario>
