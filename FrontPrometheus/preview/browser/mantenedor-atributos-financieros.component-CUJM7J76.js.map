<app-modal-formulario titulo="Cargar Tasa RJTE" subtitulo="Registre una tasa RJTE para usarla en instrumentos y reportes." accion="Registrar"
    [faltantes]="faltantes" [datos]="nuevoRegistro" [guardando]="guardando" (cerrar)="cerrar()" (guardar)="registrar()">

    <fieldset class="hig-seccion">
        <legend>Identificación</legend>
        <div class="hig-cuadricula hig-columnas-3">
            <div class="hig-campo">
                <label class="form-label" for="tr-c-nombreTasa">Nombre<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="tr-c-nombreTasa" type="text" class="form-control" autocomplete="off" placeholder="Nombre" minlength="3" maxlength="100" [(ngModel)]="nuevoRegistro.nombreTasa" required>
            </div>
            <div class="hig-campo">
                <label class="form-label" for="tr-c-nombreCorto">Nombre Corto</label>
                <input id="tr-c-nombreCorto" type="text" class="form-control" autocomplete="off" placeholder="Nombre Corto" minlength="3" maxlength="20" [(ngModel)]="nuevoRegistro.nombreCorto">
            </div>
            <div class="hig-campo">
                <label class="form-label" for="tr-c-descripcion">Descripción</label>
                <input id="tr-c-descripcion" type="text" class="form-control" autocomplete="off" placeholder="Descripción" minlength="3" maxlength="500" [(ngModel)]="nuevoRegistro.descripcion">
            </div>
        </div>
    </fieldset>

</app-modal-formulario>
