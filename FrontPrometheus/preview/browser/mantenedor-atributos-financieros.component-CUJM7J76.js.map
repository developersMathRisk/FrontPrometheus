<app-modal-formulario titulo="Editar Moneda" subtitulo="Modifique los datos de la moneda." accion="Guardar Cambios"
    [faltantes]="faltantes" [datos]="objRegistroEditado" [guardando]="guardando" (cerrar)="cerrar()" (guardar)="guardarCambios()">

    <fieldset class="hig-seccion">
        <legend>Identificación</legend>
        <div class="hig-cuadricula hig-columnas-3">
            <div class="hig-campo">
                <label class="form-label" for="mo-e-codMoneda">Código<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="mo-e-codMoneda" type="text" class="form-control" autocomplete="off" minlength="3" maxlength="3" [(ngModel)]="objRegistroEditado.codMoneda" required>
            </div>
            <div class="hig-campo">
                <label class="form-label" for="mo-e-desMoneda">Descripción<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="mo-e-desMoneda" type="text" class="form-control" autocomplete="off" minlength="2" maxlength="60" [(ngModel)]="objRegistroEditado.desMoneda" required>
            </div>
            <div class="hig-campo">
                <label class="form-label" for="mo-e-desCorto">Descripción Corta</label>
                <input id="mo-e-desCorto" type="text" class="form-control" autocomplete="off" minlength="3" maxlength="3" [(ngModel)]="objRegistroEditado.desCorto">
            </div>
            <div class="hig-campo">
                <label class="form-label" for="mo-e-codSucave">Cód. Sucave</label>
                <input id="mo-e-codSucave" type="text" class="form-control" autocomplete="off" minlength="4" maxlength="4" [(ngModel)]="objRegistroEditado.codSucave">
            </div>
        </div>
    </fieldset>

    <fieldset class="hig-seccion">
        <legend>Equivalencias</legend>
        <div class="hig-cuadricula hig-columnas-3">
            <div class="hig-campo">
                <label class="form-label" for="mo-e-codTipoRelacionUSD">
                    Relación USD
                    <i class="bi bi-info-circle-fill text-primary ms-2" data-bs-toggle="tooltip" data-bs-html="true"
                        data-bs-placement="right" title="Ingrese la letra D (Directo) o I (Indirecto)"></i>
                </label>
                <input id="mo-e-codTipoRelacionUSD" type="text" class="form-control" autocomplete="off" minlength="1" maxlength="1"
                    [(ngModel)]="objRegistroEditado.codTipoRelacionUSD" (keydown)="permitirSoloDoI($event)">
            </div>
            <div class="hig-campo">
                <label class="form-label" for="mo-e-codMonedaInt">Cód. Moneda Int.</label>
                <input id="mo-e-codMonedaInt" type="text" class="form-control" autocomplete="off" minlength="4" maxlength="4" [(ngModel)]="objRegistroEditado.codMonedaInt">
            </div>
            <div class="hig-campo">
                <label class="form-label" for="mo-e-desTicker">Ticker</label>
                <input id="mo-e-desTicker" type="text" class="form-control" autocomplete="off" minlength="3" maxlength="20" [(ngModel)]="objRegistroEditado.desTicker">
            </div>
        </div>
    </fieldset>

    <fieldset class="hig-seccion">
        <legend>Opciones</legend>
        <div class="hig-cuadricula hig-columnas-1">
            <div class="hig-opcion">
                <input class="form-check-input" type="checkbox" id="mo-e-flgCargaAutom" [(ngModel)]="objRegistroEditado.flgCargaAutom">
                <div>
                    <label class="hig-opcion__titulo" for="mo-e-flgCargaAutom">Carga automática</label>
                    <span class="hig-opcion__ayuda">El tipo de cambio se actualiza automáticamente desde la fuente de información.</span>
                </div>
            </div>
            <div class="hig-opcion">
                <input class="form-check-input" type="checkbox" id="mo-e-flgVaR" [(ngModel)]="objRegistroEditado.flgVaR">
                <div>
                    <label class="hig-opcion__titulo" for="mo-e-flgVaR">Cálculo de VaR</label>
                    <span class="hig-opcion__ayuda">Habilita esta moneda como moneda de reporte en el cálculo de Valor en Riesgo.</span>
                </div>
            </div>
        </div>
    </fieldset>

</app-modal-formulario>
