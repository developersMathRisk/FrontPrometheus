<div class="hig-tabla">

    <app-tabla-toolbar placeholder="Buscar fuente de datos o ticker…" accion="Agregar Tipo de Cambio"
        [total]="total" [filtrados]="filtrados" [ocultarResumen]="cargando || !!mensajeError" [texto]="busqueda"
        (buscar)="buscar($event)" (agregar)="registrar(cargaModal)">
    </app-tabla-toolbar>

    <div class="tabla-contenedor">
        <table mat-table [dataSource]="dataSource" matSort #sort="matSort" matSortActive="fecProceso"
            matSortDirection="asc" aria-label="Listado de tipos de cambio">

            <ng-container matColumnDef="idTipoCambio">
                <th mat-header-cell *matHeaderCellDef mat-sort-header class="col-id">ID</th>
                <td mat-cell *matCellDef="let element" class="col-id">{{ element.idTipoCambio }}</td>
            </ng-container>

            <ng-container matColumnDef="fecProceso">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Fecha de Proceso</th>
                <td mat-cell *matCellDef="let element">{{ element.fecProceso }}</td>
            </ng-container>

            <ng-container matColumnDef="codFuenteDatos">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Fuente de Datos</th>
                <td mat-cell *matCellDef="let element"><span class="fw-semibold">{{ element.codFuenteDatos }}</span></td>
            </ng-container>

            <ng-container matColumnDef="desTicker">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Ticker</th>
                <td mat-cell *matCellDef="let element">{{ element.desTicker }}</td>
            </ng-container>

            <ng-container matColumnDef="valor">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Valor</th>
                <td mat-cell *matCellDef="let element">{{ element.valor }}</td>
            </ng-container>

            <ng-container matColumnDef="acciones" stickyEnd>
                <th mat-header-cell *matHeaderCellDef class="col-acciones"><span class="solo-lector">Acciones</span></th>
                <td mat-cell *matCellDef="let element" class="col-acciones">
                    <button type="button" class="btn-fila" aria-label="Acciones del registro"
                        (click)="abrirMenuFila($event, element)">
                        <mat-icon aria-hidden="true">more_horiz</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;" (contextmenu)="onContextMenu($event, row)"></tr>
        </table>

        <app-tabla-estado [estado]="estadoTabla" tituloVacio="No hay tipos de cambio registrados"
            detalleVacio="Agregue el primero con el botón «Agregar Tipo de Cambio»." [busqueda]="busqueda"
            [mensajeError]="mensajeError" (reintentar)="listarRegistros()" (limpiar)="buscar('')"></app-tabla-estado>
    </div>

    <mat-paginator #paginator [pageSizeOptions]="[10, 20, 50, 100]" [pageSize]="20" showFirstLastButtons
        [style.display]="estadoTabla ? 'none' : null" aria-label="Paginación de tipos de cambio">
    </mat-paginator>
</div>

<div style="visibility: hidden; position: fixed"
    [style.left]="contextMenuPosition.x"
    [style.top]="contextMenuPosition.y"
    [matMenuTriggerFor]="contextMenu">
</div>

<mat-menu #contextMenu="matMenu">
    <ng-template matMenuContent let-item="item">
        <button mat-menu-item (click)="editar(selectedRow, editarModal)">
            <mat-icon>edit</mat-icon> Editar
        </button>
        <button mat-menu-item (click)="eliminar(selectedRow)">
            <mat-icon>delete</mat-icon> Eliminar
        </button>
    </ng-template>
</mat-menu>

<ng-template #cargaModal let-modal>
    <app-carga-tipo-cambio (close)="cerrarModal($event)"></app-carga-tipo-cambio>
</ng-template>

<ng-template #editarModal let-modal>
    <app-editar-tipo-cambio (close)="cerrarModal($event)" [data]="filaEditar"></app-editar-tipo-cambio>
</ng-template>
