<div class="hig-tabla">

    <app-tabla-toolbar placeholder="Buscar por vértice o curva…" accion="Agregar Tasa Interés"
        [total]="total" [filtrados]="filtrados" [ocultarResumen]="cargando || !!mensajeError" [texto]="busqueda"
        (buscar)="buscar($event)" (agregar)="registrar(cargaModal)">
    </app-tabla-toolbar>

    <div class="tabla-contenedor">
        <table mat-table [dataSource]="dataSource" matSort #sort="matSort" aria-label="Tasas de interés">

            <ng-container matColumnDef="idCurvaReferenciaPuntos">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Código</th>
                <td mat-cell *matCellDef="let element" class="col-id">{{ element.idCurvaReferenciaPuntos }}</td>
            </ng-container>
            <ng-container matColumnDef="codVertice">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Cod. Vértice</th>
                <td mat-cell *matCellDef="let element"><span class="fw-semibold">{{ element.codVertice }}</span></td>
            </ng-container>
            <ng-container matColumnDef="codCurvaProveedor">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Cod. Curva Proveedor</th>
                <td mat-cell *matCellDef="let element">{{ element.codCurvaProveedor }}</td>
            </ng-container>
            <ng-container matColumnDef="desVertice">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Des. Vértice</th>
                <td mat-cell *matCellDef="let element">{{ element.desVertice }}</td>
            </ng-container>
            <ng-container matColumnDef="numPlazo">
                <th mat-header-cell *matHeaderCellDef mat-sort-header class="col-num">Plazo</th>
                <td mat-cell *matCellDef="let element" class="col-num">{{ element.numPlazo }}</td>
            </ng-container>
            <ng-container matColumnDef="codVerticeRef">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Cod. Vértice Ref.</th>
                <td mat-cell *matCellDef="let element" [class.celda-vacia]="!element.codVerticeRef">{{ element.codVerticeRef || '—' }}</td>
            </ng-container>

            <ng-container matColumnDef="acciones" stickyEnd>
                <th mat-header-cell *matHeaderCellDef class="col-acciones"><span class="solo-lector">Acciones</span></th>
                <td mat-cell *matCellDef="let element" class="col-acciones">
                    <button type="button" class="btn-fila" aria-label="Acciones del registro"
                        (click)="abrirMenuFila($event, element)">
                        <mat-icon aria-hidden="true">more_horiz</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;" (contextmenu)="onContextMenu($event, row)"></tr>
        </table>

        <app-tabla-estado [estado]="estadoTabla" tituloVacio="No hay tasas de interés"
            detalleVacio="Agregue el primer vértice con el botón «Agregar Tasa Interés»." [busqueda]="busqueda"
            [mensajeError]="mensajeError" (reintentar)="listarRegistros()" (limpiar)="buscar('')"></app-tabla-estado>
    </div>

    <mat-paginator #paginator [pageSizeOptions]="[10, 20, 50, 100]" [pageSize]="20" showFirstLastButtons
        [style.display]="estadoTabla ? 'none' : null" aria-label="Paginación de tasas de interés">
    </mat-paginator>
</div>

<div style="visibility: hidden; position: fixed"
    [style.left]="contextMenuPosition.x"
    [style.top]="contextMenuPosition.y"
    [matMenuTriggerFor]="contextMenu">
</div>

<mat-menu #contextMenu="matMenu">
    <ng-template matMenuContent let-item="item">
        <button mat-menu-item (click)="editar(selectedRow, editarModal)">
            <mat-icon>edit</mat-icon> Editar
        </button>
        <button mat-menu-item (click)="eliminar(selectedRow)">
            <mat-icon>delete</mat-icon> Eliminar
        </button>
    </ng-template>
</mat-menu>

<ng-template #cargaModal let-modal>
    <app-carga-tasa-interes (close)="cerrarModal($event)"></app-carga-tasa-interes>
</ng-template>

<ng-template #editarModal let-modal>
    <app-editar-tasa-interes (close)="cerrarModal($event)" [data]="filaEditar"></app-editar-tasa-interes>
</ng-template>
