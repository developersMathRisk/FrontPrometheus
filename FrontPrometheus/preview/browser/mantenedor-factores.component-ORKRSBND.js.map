<app-modal-formulario titulo="Cargar Precio de Mercado" subtitulo="Registre el precio de un instrumento en una fecha determinada." accion="Registrar"
    [faltantes]="faltantes" [datos]="nuevoRegistro" (cerrar)="cerrar()" (guardar)="registrar()">

        <fieldset class="hig-seccion">
            <legend>Instrumento y fecha</legend>
            <div class="hig-cuadricula ">
                <div class="hig-campo">
                    <label class="form-label" for="pm-c-fecProceso">Fecha Proceso<span class="hig-requerido" aria-hidden="true">*</span></label>
                    <input id="pm-c-fecProceso" type="date" class="form-control" autocomplete="off" [(ngModel)]="this.nuevoRegistro.fecProceso" required>
                </div>
                <div class="hig-campo">
                    <label class="form-label" for="pm-c-idMoneda">Moneda<span class="hig-requerido" aria-hidden="true">*</span></label>
                    <div class="combo-contenedor">
                        <ng-select labelForId="pm-c-idMoneda" placeholder="Seleccione una opción…" [items]="listMoneda" bindLabel="desMoneda" bindValue="idMoneda" [(ngModel)]="this.nuevoRegistro.idMoneda" required></ng-select>
                        <button type="button" class="btn btn-outline-primary btn-wave btn-agregar" title="Agregar moneda" aria-label="Agregar moneda" (click)="abrirModalSecundario(cargaModalMoneda)"><span class="icon" aria-hidden="true">+</span></button>
                    </div>
                </div>
                <div class="hig-campo">
                    <label class="form-label" for="pm-c-nemonico">Nemónico<span class="hig-requerido" aria-hidden="true">*</span></label>
                    <input id="pm-c-nemonico" type="text" class="form-control" autocomplete="off" placeholder="Ej. AMZN" maxlength="60" [(ngModel)]="this.nuevoRegistro.nemonico" required>
                </div>
                <div class="hig-campo">
                    <label class="form-label" for="pm-c-codISIN">ISIN</label>
                    <input id="pm-c-codISIN" type="text" class="form-control" autocomplete="off" placeholder="Ej. US0231351067" maxlength="20" [(ngModel)]="this.nuevoRegistro.codISIN">
                </div>
            </div>
        </fieldset>

        <fieldset class="hig-seccion">
            <legend>Precio</legend>
            <div class="hig-cuadricula hig-columnas-3">
                <div class="hig-campo">
                    <label class="form-label" for="pm-c-numPrecioLimpio">Precio Limpio<span class="hig-requerido" aria-hidden="true">*</span></label>
                    <input id="pm-c-numPrecioLimpio" type="number" class="form-control" autocomplete="off" placeholder="0.00" step="any" inputmode="decimal" [(ngModel)]="this.nuevoRegistro.numPrecioLimpio" required>
                </div>
                <div class="hig-campo">
                    <label class="form-label" for="pm-c-numPrecioSucio">Precio Sucio</label>
                    <input id="pm-c-numPrecioSucio" type="number" class="form-control" autocomplete="off" step="any" inputmode="decimal" [(ngModel)]="this.nuevoRegistro.numPrecioSucio">
                </div>
                <div class="hig-campo">
                    <label class="form-label" for="pm-c-numInteresCorrido">Interés Corrido</label>
                    <input id="pm-c-numInteresCorrido" type="number" class="form-control" autocomplete="off" step="any" inputmode="decimal" [(ngModel)]="this.nuevoRegistro.numInteresCorrido">
                </div>
            </div>
        </fieldset>

        <details class="hig-detalles">
            <summary>Datos de renta fija<span class="hig-detalles__nota">Opcional</span></summary>
            <p class="hig-seccion__ayuda">Solo aplican a bonos y otros instrumentos de deuda.</p>
            <div class="hig-cuadricula hig-columnas-3">
                <div class="hig-campo">
                    <label class="form-label" for="pm-c-numTIR">TIR</label>
                    <input id="pm-c-numTIR" type="number" class="form-control" autocomplete="off" step="any" inputmode="decimal" [(ngModel)]="this.nuevoRegistro.numTIR">
                </div>
                <div class="hig-campo">
                    <label class="form-label" for="pm-c-numDurMacaulay">Dur. Macaulay</label>
                    <input id="pm-c-numDurMacaulay" type="number" class="form-control" autocomplete="off" step="any" inputmode="decimal" [(ngModel)]="this.nuevoRegistro.numDurMacaulay">
                </div>
                <div class="hig-campo">
                    <label class="form-label" for="pm-c-numDurModified">Dur. Modificada</label>
                    <input id="pm-c-numDurModified" type="number" class="form-control" autocomplete="off" step="any" inputmode="decimal" [(ngModel)]="this.nuevoRegistro.numDurModified">
                </div>
                <div class="hig-campo">
                    <label class="form-label" for="pm-c-numConvexidad">Convexidad</label>
                    <input id="pm-c-numConvexidad" type="number" class="form-control" autocomplete="off" step="any" inputmode="decimal" [(ngModel)]="this.nuevoRegistro.numConvexidad">
                </div>
                <div class="hig-campo">
                    <label class="form-label" for="pm-c-numValorFacial">Valor Facial</label>
                    <input id="pm-c-numValorFacial" type="number" class="form-control" autocomplete="off" step="any" inputmode="decimal" [(ngModel)]="this.nuevoRegistro.numValorFacial">
                </div>
                <div class="hig-campo">
                    <label class="form-label" for="pm-c-numTasaCupon">Tasa Cupón (%)</label>
                    <input id="pm-c-numTasaCupon" type="number" class="form-control" autocomplete="off" step="any" inputmode="decimal" [(ngModel)]="this.nuevoRegistro.numTasaCupon">
                </div>
                <div class="hig-campo">
                    <label class="form-label" for="pm-c-maturity">Fecha Vencimiento</label>
                    <input id="pm-c-maturity" type="date" class="form-control" autocomplete="off" [(ngModel)]="this.nuevoRegistro.maturity">
                </div>
            </div>
        </details>

</app-modal-formulario>

<ng-template #cargaModalMoneda let-modal>
    <app-carga-moneda (close)="cerrarModalSecundario($event)"></app-carga-moneda>
</ng-template>
