<div class="page page-style1 page-style2 error-page">
    <div class="d-md-flex">
        <div class="w-40p bg-style h-100vh page-style">
            <div class="page-content">
                <div class="page-single-content">
                    <img [routerLink]="['/dashboards/sales']" src="./assets/images/brand-logos/desktop-white.png" alt="img" class="header-brand-img mb-4">
                    <div class="card-body text-white py-5 px-5">
                        <img src="./assets/images/png/1.png" alt="img" class="w-100 mx-auto text-center">
                    </div>
                </div>
            </div>
        </div>
        <div class="w-80p page-content">
            <div class="page-single-content">
                <div class="card-body p-3 p-sm-5">
                    <div class="row g-0">
                        <div class="col-md-5 mx-auto d-block">
                            <div class="text-center mb-4 ">
                                <span class="avatar avatar-xxl avatar-rounded">
                                    <img src="./assets/images/faces/16.jpg" alt="">
                                </span>
                            </div>
                            <span class="m-4 d-block text-center">
                                <span class=""><strong>John Thomson</strong></span>
                            </span>
                            <div class="mb-3">
                                <input type="password" class="form-control" id="exampleInputPassword1" placeholder="Password">
                            </div>
                            <a [routerLink]="['/dashboards/sales']" class="btn btn-lg btn-primary btn-block w-100"><i class="fe fe-arrow-right"></i> Unlock</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
