 <!-- Start::row-1 -->
 <div class="row justify-content-center">
    <div class="col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-xm-12">
        <div class="card custom-card overflow-hidden">
            <div class="top-left"></div>
            <div class="top-right"></div>
            <div class="bottom-left"></div>
            <div class="bottom-right"></div>
            <div class="card-body p-0">
                <div class="contact-page-banner text-center mb-5">
                    <div class="text-  px-5 px-xxl-0">
                        <h3 class="fw-medium text-fixed-white">Contact US !</h3>
                        <h6 class="text-fixed-white  fw-normal op-8 text-wrap">Have any questions ? We would love to hear from
                            you. </h6>
                    </div>
                </div>
                <div class="row mx-xl-3 px-xl-5 p-3 pt-0 pb-4">
            
                    <div class="col-xxl-6 col-xl-6 col-lg-12 col-md-12 col-sm-12">
                        <div class="card custom-card contactus-form contactus-form-left overflow-hidden">
                            <div class="top-left"></div>
                            <div class="top-right"></div>
                            <div class="bottom-left"></div>
                            <div class="bottom-right"></div>
                            <div class="card-header px-4 px-xl-5 pt-5">
                                <div class="card-title">
                                    Contact Information
                                </div>
                            </div>
                            <div class="card-body text-start px-xl-5 px-4 py-4">
                                <div class="mb-3"><i class="ri-map-pin-fill me-2 text-primary"></i> D.No: 1352/A-12, Street,
                                    Hyderabad.</div>
                                <div class="mb-3"><i class="ri-phone-fill text-primary"></i> +122 1234 32422</div>
                                <div class="mb-4"><i class="ri-mail-fill text-primary"></i> carolinahanna424&#64;example.com</div>
                                <iframe src="https://www.google.com/maps/embed?pb=!1m26!1m12!1m3!1d30444.274596168965!2d78.54114692513858!3d17.48198883339408!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!4m11!3e6!4m3!3m2!1d17.4886524!2d78.5495041!4m5!1s0x3bcb9c7ec139a15d%3A0x326d1c90786b2ab6!2sspruko%20technologies!3m2!1d17.474805099999998!2d78.570258!5e0!3m2!1sen!2sin!4v1670225507254!5m2!1sen!2sin" height="214" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                            </div>
                        </div>
                    </div>
                    <div class="col-xxl-6 col-xl-6 col-lg-12 col-md-12 col-sm-12">
                        <div class="card custom-card contactus-form contactus-form-right overflow-hidden">
                            <div class="top-left"></div>
                            <div class="top-right"></div>
                            <div class="bottom-left"></div>
                            <div class="bottom-right"></div>
                            <div class="card-header px-xl-5 px-4 pt-5">
                                <div class="card-title">
                                    Get In Touch !
                                </div>
                            </div>
                            <div class="card-body p-xl-5 p-4 pt-xl-4">
                                <div class="row gy-3 text-start">
                                    <div class="col-xl-12">
                                        <label for="contact-address-firstname" class="form-label">First Name :</label>
                                        <input type="text" class="form-control" id="contact-address-firstname"
                                            placeholder="Enter Name">
                                    </div>
                                    <div class="col-xl-12">
                                        <label for="contact-address-email" class="form-label">Email Id :</label>
                                        <input type="email" class="form-control" id="contact-address-email"
                                            placeholder="Enter Email Id">
                                    </div>
                                    <div class="col-xl-6">
                                        <label for="contact-address-address" class="form-label">Address :</label>
                                        <textarea class="form-control" id="contact-address-address" rows="2"></textarea>
                                    </div>
                                    <div class="col-xl-6">
                                        <label for="contact-mail-message" class="form-label">Message :</label>
                                        <textarea class="form-control" id="contact-mail-message" rows="2"></textarea>
                                    </div>
                                </div>
                                <div class=" mt-4">
                                    <button class="btn btn-primary-light btn-wave btn-grid w-100">Send Message</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            
            </div>
        </div>
    </div>
</div>
<!--End::row-1 -->
