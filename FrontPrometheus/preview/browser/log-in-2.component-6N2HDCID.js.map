<div class="row authentication mx-0">

    <div class="col-xxl-5 col-xl-5 col-lg-12">
        <div class="row justify-content-center align-items-center h-100 w-80p bg-style h-100vh page-style">
                <img [routerLink]="['/dashboards/sales']" src="./assets/images/brand-logos/desktop-white.png" alt="img" class="header-brand-img mb-4">
                <div class="card-body text-white py-5 px-5">
                    <img src="./assets/images/png/3.png" alt="img" class="w-100 mx-auto text-center">
                </div>
        </div>
    </div>
    <div class="col-xxl-7 col-xl-7 col-lg-7 d-xl-block d-none px-0">
        <div class="authentication-cover">
            <div class="col-md-8 mx-auto d-block">
                <div class="">
                    <h1 class="mb-2">Login</h1>
                    <p class="text-muted">Sign In to your account</p>
                </div>
                <div class="btn-list d-lg-flex">
                    <a href="javascript:void(0)"  class="btn btn-danger btn-w-lg d-block w-100">Google</a>
                    <a href="javascript:void(0)"  class="btn btn-info d-lg-inline d-block">Twitter</a>
                    <a href="javascript:void(0)"  class="btn btn-primary d-lg-inline d-block me-2">Facebook</a>
                </div>
                <hr class="divider my-5">
                <div class="input-group mb-3">
                    <span class="input-group-addon"><svg class="svg-icon" xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 0 24 24" width="24"><path d="M0 0h24v24H0V0z" fill="none"></path><path d="M12 16c-2.69 0-5.77 1.28-6 2h12c-.2-.71-3.3-2-6-2z" opacity=".3"></path><circle cx="12" cy="8" opacity=".3" r="2"></circle><path d="M12 14c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4zm-6 4c.22-.72 3.31-2 6-2 2.7 0 5.8 1.29 6 2H6zm6-6c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0-6c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2z"></path></svg></span>
                    <input type="text" class="form-control" placeholder="Username">
                </div>
                <div class="input-group mb-4">
                    <span class="input-group-addon"><svg class="svg-icon" xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 0 24 24" width="24"><g fill="none"><path d="M0 0h24v24H0V0z"></path><path d="M0 0h24v24H0V0z" opacity=".87"></path></g><path d="M6 20h12V10H6v10zm6-7c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2z" opacity=".3"></path><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm9 14H6V10h12v10zm-6-3c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"></path></svg></span>
                    <input type="password" class="form-control" placeholder="Password">
                </div>
                <div class="row">
                    <div class="col-12">
                        <a [routerLink]="['/accounts/forgot-password/forgot-password-1']" class="btn btn-link box-shadow-0 px-0 text-primary">Forgot password?</a>
                    </div>
                    <div class="col-12">
                        <a [routerLink]="['/dashboards/sales']" class="btn btn-primary btn-block w-100"> <i class="fe fe-arrow-right"></i> Login</a>
                    </div>
                </div>
                <div class="pt-4">
                    <div class="fw-normal fs-16">You Don't have an account <a class="btn-link fw-normal text-primary" [routerLink]="['/accounts/register/register-2']">Register Here</a></div>
                </div>
            </div>
        </div>
    </div>

</div>
