<div class="page-header dashboard-pageheader d-flex justify-content-between align-items-center">
    <div class="d-flex flex-column">
        <h1 class="page-title my-auto">Instrumentos Financieros</h1>
        <p class="productos-subtitulo">Acciones, bonos y fondos que se valorizan y forman parte de los portafolios.</p>
    </div>
</div>

<div class="productos-segmentado" role="tablist" aria-label="Tipo de instrumento">
    <button *ngFor="let producto of productos; let i = index" #segmento type="button" role="tab"
        class="productos-segmento" [class.activo]="producto.id === productoSeleccionado"
        [id]="'producto-tab-' + producto.id" aria-controls="producto-panel"
        [attr.aria-selected]="producto.id === productoSeleccionado"
        [attr.tabindex]="producto.id === productoSeleccionado ? 0 : -1"
        (click)="seleccionar(producto.id)" (keydown)="alTeclear($event, i)">
        {{ producto.etiqueta }}
    </button>
</div>

<section id="producto-panel" class="card productos-panel" role="tabpanel"
    [attr.aria-labelledby]="'producto-tab-' + productoSeleccionado">
    <div class="card-body">
        <p class="productos-descripcion">{{ actual.descripcion }}</p>
        <ng-container *ngComponentOutlet="actual.componente"></ng-container>
    </div>
</section>
