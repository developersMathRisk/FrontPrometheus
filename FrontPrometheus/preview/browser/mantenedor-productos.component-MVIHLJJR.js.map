<app-modal-formulario titulo="Editar Bono" subtitulo="Código {{ data.idBono }}. Modifique los datos y guarde los cambios." accion="Guardar Cambios"
    [faltantes]="faltantes" [datos]="objRegistroEditado" (cerrar)="cerrar()" (guardar)="guardarCambios()">

        <fieldset class="hig-seccion">
            <legend>Identificación</legend>
            <div class="hig-cuadricula hig-columnas-3">
                <div class="hig-campo">
                    <label class="form-label" for="bo-e-codISIN">Código ISIN<span class="hig-requerido" aria-hidden="true">*</span></label>
                    <input id="bo-e-codISIN" type="text" class="form-control" autocomplete="off" placeholder="Ej. PEP01000C5D1" maxlength="12" [(ngModel)]="this.objRegistroEditado.codISIN" required>
                </div>
                <div class="hig-campo">
                    <label class="form-label" for="bo-e-ticker">Ticker<span class="hig-requerido" aria-hidden="true">*</span></label>
                    <input id="bo-e-ticker" type="text" class="form-control" autocomplete="off" placeholder="Ej. SB12AGO28" maxlength="20" [(ngModel)]="this.objRegistroEditado.ticker" required>
                </div>
                <div class="hig-campo">
                    <label class="form-label" for="bo-e-idTipoBono">Tipo Bono<span class="hig-requerido" aria-hidden="true">*</span></label>
                    <div class="combo-contenedor">
                        <ng-select labelForId="bo-e-idTipoBono" placeholder="Seleccione una opción…" [items]="listTipoBonoSBS" bindLabel="descripcionTipoBono" bindValue="idTipoBono" [(ngModel)]="this.objRegistroEditado.idTipoBono" required></ng-select>
                        <button type="button" class="btn btn-outline-primary btn-wave btn-agregar" title="Agregar tipo bono" aria-label="Agregar tipo bono" (click)="abrirModalSecundario(cargaModalTipoBono)"><span class="icon" aria-hidden="true">+</span></button>
                    </div>
                </div>
            </div>
        </fieldset>

        <fieldset class="hig-seccion">
            <legend>Condiciones financieras</legend>
            <div class="hig-cuadricula hig-columnas-3">
                <div class="hig-campo">
                    <label class="form-label" for="bo-e-montoNominal">Nominal</label>
                    <input id="bo-e-montoNominal" type="number" class="form-control" autocomplete="off" step="any" inputmode="decimal" [(ngModel)]="this.objRegistroEditado.montoNominal">
                </div>
                <div class="hig-campo">
                    <label class="form-label" for="bo-e-tasaCupon">Tasa Cupón (%)</label>
                    <input id="bo-e-tasaCupon" type="number" class="form-control" autocomplete="off" step="any" inputmode="decimal" [(ngModel)]="this.objRegistroEditado.tasaCupon">
                    <p class="hig-campo__ayuda">Expresada en porcentaje, por ejemplo 6.35.</p>
                </div>
                <div class="hig-campo">
                    <label class="form-label" for="bo-e-spread">Spread</label>
                    <input id="bo-e-spread" type="number" class="form-control" autocomplete="off" step="any" inputmode="decimal" [(ngModel)]="this.objRegistroEditado.spread">
                </div>
                <div class="hig-campo">
                    <label class="form-label" for="bo-e-idTipoTasaInteres">Tipo Tasa Interés<span class="hig-requerido" aria-hidden="true">*</span></label>
                    <div class="combo-contenedor">
                        <ng-select labelForId="bo-e-idTipoTasaInteres" placeholder="Seleccione una opción…" [items]="listTipoTasaInt" bindLabel="descripcionTipoTasa" bindValue="idTipoTasaInteres" [(ngModel)]="this.objRegistroEditado.idTipoTasaInteres" required></ng-select>
                        <button type="button" class="btn btn-outline-primary btn-wave btn-agregar" title="Agregar tipo tasa interés" aria-label="Agregar tipo tasa interés" (click)="abrirModalSecundario(cargaModalTipoTasaInteres)"><span class="icon" aria-hidden="true">+</span></button>
                    </div>
                </div>
                <div class="hig-campo">
                    <label class="form-label" for="bo-e-idFormulaTasa">Fórmula Tasa<span class="hig-requerido" aria-hidden="true">*</span></label>
                    <div class="combo-contenedor">
                        <ng-select labelForId="bo-e-idFormulaTasa" placeholder="Seleccione una opción…" [items]="listFormulaTasa" bindLabel="descripcionFormula" bindValue="idFormulaTasa" [(ngModel)]="this.objRegistroEditado.idFormulaTasa" required></ng-select>
                        <button type="button" class="btn btn-outline-primary btn-wave btn-agregar" title="Agregar fórmula tasa" aria-label="Agregar fórmula tasa" (click)="abrirModalSecundario(cargaModalFormulaTasa)"><span class="icon" aria-hidden="true">+</span></button>
                    </div>
                </div>
                <div class="hig-campo">
                    <label class="form-label" for="bo-e-idCurvaReferencia">Curva Referencia<span class="hig-requerido" aria-hidden="true">*</span></label>
                    <div class="combo-contenedor">
                        <ng-select labelForId="bo-e-idCurvaReferencia" placeholder="Seleccione una opción…" [items]="listCurvaReferencia" bindLabel="descripcionCurva" bindValue="idCurvaReferencia" [(ngModel)]="this.objRegistroEditado.idCurvaReferencia" required></ng-select>
                        <button type="button" class="btn btn-outline-primary btn-wave btn-agregar" title="Agregar curva referencia" aria-label="Agregar curva referencia" (click)="abrirModalSecundario(cargaModalCurvaReferencia)"><span class="icon" aria-hidden="true">+</span></button>
                    </div>
                </div>
            </div>
        </fieldset>

        <fieldset class="hig-seccion">
            <legend>Fechas</legend>
            <p class="hig-seccion__ayuda">Son obligatorias si activa la generación automática de la cuponera.</p>
            <div class="hig-cuadricula hig-columnas-3">
                <div class="hig-campo">
                    <label class="form-label" for="bo-e-fechaEmision">Fecha Emisión</label>
                    <input id="bo-e-fechaEmision" type="date" class="form-control" autocomplete="off" [(ngModel)]="this.objRegistroEditado.fechaEmision">
                </div>
                <div class="hig-campo">
                    <label class="form-label" for="bo-e-fechaPrimerCupon">Fecha Primer Cupón</label>
                    <input id="bo-e-fechaPrimerCupon" type="date" class="form-control" autocomplete="off" [(ngModel)]="this.objRegistroEditado.fechaPrimerCupon">
                </div>
                <div class="hig-campo">
                    <label class="form-label" for="bo-e-fechaVencimiento">Fecha Vencimiento</label>
                    <input id="bo-e-fechaVencimiento" type="date" class="form-control" autocomplete="off" [(ngModel)]="this.objRegistroEditado.fechaVencimiento">
                </div>
            </div>
        </fieldset>

        <fieldset class="hig-seccion">
            <legend>Emisor y cálculo</legend>
            <div class="hig-cuadricula hig-columnas-3">
                <div class="hig-campo">
                    <label class="form-label" for="bo-e-idEmisor">Emisor<span class="hig-requerido" aria-hidden="true">*</span></label>
                    <div class="combo-contenedor">
                        <ng-select labelForId="bo-e-idEmisor" placeholder="Seleccione una opción…" [items]="listEmisor" bindLabel="nomEmisor" bindValue="idEmisor" [(ngModel)]="this.objRegistroEditado.idEmisor" required></ng-select>
                        <button type="button" class="btn btn-outline-primary btn-wave btn-agregar" title="Agregar emisor" aria-label="Agregar emisor" (click)="abrirModalSecundario(cargaModalEmisor)"><span class="icon" aria-hidden="true">+</span></button>
                    </div>
                </div>
                <div class="hig-campo">
                    <label class="form-label" for="bo-e-idMoneda">Moneda<span class="hig-requerido" aria-hidden="true">*</span></label>
                    <div class="combo-contenedor">
                        <ng-select labelForId="bo-e-idMoneda" placeholder="Seleccione una opción…" [items]="listMoneda" bindLabel="desMoneda" bindValue="idMoneda" [(ngModel)]="this.objRegistroEditado.idMoneda" required></ng-select>
                        <button type="button" class="btn btn-outline-primary btn-wave btn-agregar" title="Agregar moneda" aria-label="Agregar moneda" (click)="abrirModalSecundario(cargaModalMoneda)"><span class="icon" aria-hidden="true">+</span></button>
                    </div>
                </div>
                <div class="hig-campo">
                    <label class="form-label" for="bo-e-idMetodoAmortizacion">Método Amortización<span class="hig-requerido" aria-hidden="true">*</span></label>
                    <div class="combo-contenedor">
                        <ng-select labelForId="bo-e-idMetodoAmortizacion" placeholder="Seleccione una opción…" [items]="listMetodoAmotizacion" bindLabel="descripcionMetodo" bindValue="idMetodoAmortizacion" [(ngModel)]="this.objRegistroEditado.idMetodoAmortizacion" required></ng-select>
                        <button type="button" class="btn btn-outline-primary btn-wave btn-agregar" title="Agregar método amortización" aria-label="Agregar método amortización" (click)="abrirModalSecundario(cargaModalMetodoAmortizacion)"><span class="icon" aria-hidden="true">+</span></button>
                    </div>
                </div>
                <div class="hig-campo">
                    <label class="form-label" for="bo-e-idCalculobase">Cálculo Base<span class="hig-requerido" aria-hidden="true">*</span></label>
                    <div class="combo-contenedor">
                        <ng-select labelForId="bo-e-idCalculobase" placeholder="Seleccione una opción…" [items]="listCalculoBase" bindLabel="descripcionCalculoBase" bindValue="idCalculobase" [(ngModel)]="this.objRegistroEditado.idCalculobase" required></ng-select>
                        <button type="button" class="btn btn-outline-primary btn-wave btn-agregar" title="Agregar cálculo base" aria-label="Agregar cálculo base" (click)="abrirModalSecundario(cargaModalCalculoBase)"><span class="icon" aria-hidden="true">+</span></button>
                    </div>
                </div>
                <div class="hig-campo">
                    <label class="form-label" for="bo-e-idFrecuenciaPago">Frecuencia Pago<span class="hig-requerido" aria-hidden="true">*</span></label>
                    <div class="combo-contenedor">
                        <ng-select labelForId="bo-e-idFrecuenciaPago" placeholder="Seleccione una opción…" [items]="listFrecPago" bindLabel="descripcionFrecuencia" bindValue="idFrecuenciaPago" [(ngModel)]="this.objRegistroEditado.idFrecuenciaPago" required></ng-select>
                        <button type="button" class="btn btn-outline-primary btn-wave btn-agregar" title="Agregar frecuencia pago" aria-label="Agregar frecuencia pago" (click)="abrirModalSecundario(cargaModalFrecuenciaPago)"><span class="icon" aria-hidden="true">+</span></button>
                    </div>
                </div>
            </div>
        </fieldset>

</app-modal-formulario>

<ng-template #cargaModalEmisor let-modal>
    <app-carga-emisor (close)="cerrarModalSecundario($event)"></app-carga-emisor>
</ng-template>
<ng-template #cargaModalMoneda let-modal>
    <app-carga-moneda (close)="cerrarModalSecundario($event)"></app-carga-moneda>
</ng-template>
<ng-template #cargaModalTipoBono let-modal>
    <app-carga-tipo-bono-sbs (close)="cerrarModalSecundario($event)"></app-carga-tipo-bono-sbs>
</ng-template>
<ng-template #cargaModalCurvaReferencia let-modal>
    <app-carga-curva-referencia (close)="cerrarModalSecundario($event)"></app-carga-curva-referencia>
</ng-template>
<ng-template #cargaModalMetodoAmortizacion let-modal>
    <app-carga-metodo-amortizacion (close)="cerrarModalSecundario($event)"></app-carga-metodo-amortizacion>
</ng-template>
<ng-template #cargaModalCalculoBase let-modal>
    <app-carga-calculo-base-interes (close)="cerrarModalSecundario($event)"></app-carga-calculo-base-interes>
</ng-template>
<ng-template #cargaModalFrecuenciaPago let-modal>
    <app-carga-frecuencia-pago (close)="cerrarModalSecundario($event)"></app-carga-frecuencia-pago>
</ng-template>
<ng-template #cargaModalTipoTasaInteres let-modal>
    <app-carga-tipo-tasa (close)="cerrarModalSecundario($event)"></app-carga-tipo-tasa>
</ng-template>
<ng-template #cargaModalFormulaTasa let-modal>
    <app-carga-formula-tasa (close)="cerrarModalSecundario($event)"></app-carga-formula-tasa>
</ng-template>
<ng-template #cargaModalTipoInstrumento let-modal>
    <app-carga-tipo-instrumento (close)="cerrarModalSecundario($event)"></app-carga-tipo-instrumento>
</ng-template>
