<div class="page page-style1 error-page">
    <div class="page-single p-5">
        <div class="row justify-content-center mt-5 mt-sm-0">
            <div class="col-lg-9 col-xl-8">
                <div class="card-group mb-0">
                    <div class="card p-4 page-content">
                        <div class="card-body page-single-content">
                            <div class="w-100">
                                <h1 class="mb-2">Register</h1>
                                <p class="text-muted">Create New Account</p>
                                <div class="btn-list d-xl-flex">
                                    <a href="javascript:void(0)" class="btn btn-danger btn-w-lg d-block w-100">Google</a>
                                    <a href="javascript:void(0)" class="btn btn-info d-xl-inline d-block">Twitter</a>
                                    <a href="javascript:void(0)" class="btn btn-primary d-xl-inline d-block me-2">Facebook</a>
                                </div>
                                <hr class="divider my-5">
                                <div class="input-group mb-3">
                                    <span class="input-group-addon"><svg class="svg-icon" xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 0 24 24" width="24"><path d="M0 0h24v24H0V0z" fill="none"></path><path d="M12 16c-2.69 0-5.77 1.28-6 2h12c-.2-.71-3.3-2-6-2z" opacity=".3"></path><circle cx="12" cy="8" opacity=".3" r="2"></circle><path d="M12 14c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4zm-6 4c.22-.72 3.31-2 6-2 2.7 0 5.8 1.29 6 2H6zm6-6c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0-6c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2z"></path></svg></span>
                                    <input type="text" class="form-control" placeholder="Username">
                                </div>
                                <div class="input-group mb-4">
                                    <span class="input-group-addon"><svg class="svg-icon" xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 0 24 24" width="24"><path d="M0 0h24v24H0V0z" fill="none"></path><path d="M20 8l-8 5-8-5v10h16zm0-2H4l8 4.99z" opacity=".3"></path><path d="M4 20h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2zM20 6l-8 4.99L4 6h16zM4 8l8 5 8-5v10H4V8z"></path></svg></span>
                                    <input type="text" class="form-control" placeholder="Enter Email">
                                </div>
                                <div class="input-group mb-4">
                                    <span class="input-group-addon"><svg class="svg-icon" xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 0 24 24" width="24"><g fill="none"><path d="M0 0h24v24H0V0z"></path><path d="M0 0h24v24H0V0z" opacity=".87"></path></g><path d="M6 20h12V10H6v10zm6-7c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2z" opacity=".3"></path><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm9 14H6V10h12v10zm-6-3c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"></path></svg></span>
                                    <input type="password" class="form-control" placeholder="Password">
                                </div>
                                <div class="mb-3">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="" id="privacy-policy">
                                        <label class="form-check-label text-muted" for="privacy-policy">
                                            Agree the
                                        </label><a [routerLink]="['/pages/terms-conditions']" class="fw-semibold text-muted ms-1">terms and policy</a>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-12">
                                        <a [routerLink]="['/dashboards/sales']" class="btn btn-lg btn-primary btn-block px-4 w-100"><i class="fe fe-arrow-right"></i> Create a new account</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="card text-white bg-primary py-5 d-none d-sm-block page-content mt-0">
                        <div class="card-body text-center justify-content-center page-single-content h-100">
                            <img src="./assets/images/pattern/3.png" alt="img" class="w-100">
                        </div>
                    </div>
                </div>
                <div class="text-center pt-4">
                    <div class="fw-normal fs-16">You Already have an account <a class="btn-link fw-normal text-primary" [routerLink]="['/accounts/log-in/log-in-1']"> Login Here</a></div>
                </div>
            </div>
        </div>
    </div>
</div>
