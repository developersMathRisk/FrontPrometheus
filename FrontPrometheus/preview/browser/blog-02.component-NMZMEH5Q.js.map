<app-page-header hassub="" sub="Pages" title1="Blog" title="Blog 2" activeTitle="Blog 2" ></app-page-header>
<!-- Start::row-1 -->
 <div class="row">
    @for (data of blogData; track $index) {

        <div class="col-xl-3 col-lg-6 col-md-12">
            <div class="card overflow-hidden">
                <div class="card-body">
                    <div class="d-flex align-items-center mb-4">
                        <img src="./assets/images/faces/16.jpg" alt="blog-img"  class="avatar avatar-rounded avatar-md me-3">
                        <div>
                            <a [routerLink]="['/pages/profile/profile-1']" class="fw-semibold">Anna Ogden</a>
                            <small class="d-block text-muted">2 days ago</small>
                        </div>
                        <div ngbDropdown class="ms-auto text-muted">
                            <a ngbDropdownToggle aria-label="anchor" class="option-dots new-list2 no-caret" data-bs-toggle="dropdown"><svg class="svg-icon" xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 0 24 24" width="24"><path d="M0 0h24v24H0V0z" fill="none"></path><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"></path></svg></a>
                            <div ngbDropdownMenu class="dropdown-menu tx-13 dropdown-menu-end">
                                <a class="dropdown-item" href="javascript:void(0)">Assigned to</a>
                                <a class="dropdown-item" href="javascript:void(0)">Mark As Unread</a>
                                <a class="dropdown-item" href="javascript:void(0)">Mark As Important</a>
                                <a class="dropdown-item" href="javascript:void(0)">Add Star</a>
                                <a class="dropdown-item" href="javascript:void(0)">Move to</a>
                                <a class="dropdown-item" href="javascript:void(0)">Mute</a>
                                <a class="dropdown-item" href="javascript:void(0)">Move to Trash</a>
                            </div>
                        </div>
                    </div>
                    <div class="item7-card-img">
                        <a [routerLink]="['/pages/blog/blog-details']">
                            <img [src]="data.image" alt="img" class="cover-image br-7 w-100">
                        </a>
                    </div>
                    <div class="item7-card-desc d-flex my-4">
                        <a href="javascript:void(0)" class="d-flex"><svg class="svg-icon me-2" xmlns="http://www.w3.org/2000/svg" height="18" viewBox="0 0 24 24" width="18"><path d="M0 0h24v24H0V0z" fill="none"></path><path d="M20 3h-1V1h-2v2H7V1H5v2H4c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 2v3H4V5h16zM4 21V10h16v11H4z"></path><path d="M4 5.01h16V8H4z" opacity=".3"></path></svg><div class="mt-0">{{data.date}}</div></a>
                        <div class="ms-auto">
                            <a class="me-0 d-flex" href="javascript:void(0)"><svg class="svg-icon me-2" xmlns="http://www.w3.org/2000/svg" height="18" viewBox="0 0 24 24" width="18"><path d="M0 0h24v24H0V0z" fill="none"></path><path d="M20 17.17V4H4v12h14.83L20 17.17zM18 14H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z" opacity=".3"></path><path d="M4 18h14l4 4-.01-18c0-1.1-.89-2-1.99-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2zM4 4h16v13.17L18.83 16H4V4zm2 8h12v2H6zm0-3h12v2H6zm0-3h12v2H6z"></path></svg><div class="mt-0">{{data.comments}} Comments</div></a>
                        </div>
                    </div>
                    <a href="javascript:void(0)" class="mt-4">
                        <h5 class="fw-semibold">{{data.title}}</h5>
                    </a>
                    <p class="mb-0">Lorem ipsum dolor quis exercitationem into enim ad minima nostrum itationem </p>
                </div>
                <div class="card-footer d-flex align-items-center">
                    <div class="avatar-list-stacked">
                        <span class="avatar avatar-rounded avatar-sm"><img src="./assets/images/faces/12.jpg" alt="img"></span>
                        <span class="avatar avatar-rounded avatar-sm"><img src="./assets/images/faces/2.jpg" alt="img"></span>
                        <span class="avatar avatar-rounded avatar-sm"><img src="./assets/images/faces/9.jpg" alt="img"></span>
                        <span class="avatar avatar-rounded avatar-sm"><img src="./assets/images/faces/2.jpg" alt="img"></span>
                    </div>
                    <div class="ms-auto">
                        <div class="d-flex">
                            <a aria-label="anchor" class="new" href="JavaScript:void(0);"><svg class="svg-icon me-3 mt-2" xmlns="http://www.w3.org/2000/svg" height="18" viewBox="0 0 24 24" width="18"><path d="M0 0h24v24H0V0z" fill="none"></path><path d="M16.5 5c-1.54 0-3.04.99-3.56 2.36h-1.87C10.54 5.99 9.04 5 7.5 5 5.5 5 4 6.5 4 8.5c0 2.89 3.14 5.74 7.9 10.05l.1.1.1-.1C16.86 14.24 20 11.39 20 8.5c0-2-1.5-3.5-3.5-3.5z" opacity=".3"></path><path d="M16.5 3c-1.74 0-3.41.81-4.5 2.09C10.91 3.81 9.24 3 7.5 3 4.42 3 2 5.42 2 8.5c0 3.78 3.4 6.86 8.55 11.54L12 21.35l1.45-1.32C18.6 15.36 22 12.28 22 8.5 22 5.42 19.58 3 16.5 3zm-4.4 15.55l-.1.1-.1-.1C7.14 14.24 4 11.39 4 8.5 4 6.5 5.5 5 7.5 5c1.54 0 3.04.99 3.57 2.36h1.87C13.46 5.99 14.96 5 16.5 5c2 0 3.5 1.5 3.5 3.5 0 2.89-3.14 5.74-7.9 10.05z"></path></svg></a>
                            <a aria-label="anchor" class="new" href="JavaScript:void(0);"><svg class="svg-icon me-3 mt-2" xmlns="http://www.w3.org/2000/svg" height="18" viewBox="0 0 24 24" width="18"><path d="M0 0h24v24H0V0z" fill="none"></path><path d="M20 17.17V4H4v12h14.83L20 17.17zM18 14H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z" opacity=".3"></path><path d="M4 18h14l4 4-.01-18c0-1.1-.89-2-1.99-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2zM4 4h16v13.17L18.83 16H4V4zm2 8h12v2H6zm0-3h12v2H6zm0-3h12v2H6z"></path></svg></a>
                            <a aria-label="anchor" class="new" href="JavaScript:void(0);"><svg class="svg-icon mt-2" xmlns="http://www.w3.org/2000/svg" height="18" viewBox="0 0 24 24" width="18"><path d="M0 0h24v24H0V0z" fill="none"></path><circle cx="18" cy="5" opacity=".3" r="1"></circle><circle cx="6" cy="12" opacity=".3" r="1"></circle><circle cx="18" cy="19.02" opacity=".3" r="1"></circle><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92zM18 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zM6 13c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm12 7.02c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"></path></svg></a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    }
</div>
<!-- End::row-1 -->
