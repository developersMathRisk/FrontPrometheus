<app-page-header hassub="Apps" sub="" title1="Userlist" title="User List 4" activeTitle="User List 4"></app-page-header>
 <!-- Start:: row-1 -->
  <div class="card">
    <div class="card-body pb-2">
        <div class="row mb-3 gap-3">
            <div class="col">
                <a href="javascript:void(0)" class="btn btn-primary"><i class="fe fe-plus"></i> Add New User</a>
            </div>
            <div class="col col-auto">
                <div class="input-group w-auto">
                    <button aria-label="button" class="btn btn-light bg-white border-end-0" type="button"><i class="fe fe-search"></i></button>
                    <input type="text" class="form-control border-start-0" placeholder="Search Files">
                </div>
            </div>
        </div>
        <div class="row">
            @for (item of listData; track $index) {
                <div class="col-xl-4 col-lg-6">
                    <div class="card border p-0 shadow-none overflow-hidden">
                        <div class="d-flex align-items-center p-4">
                            <img alt="" [src]="item.image" class="avatar avatar-lg avatar-rounded d-block cover-image">
                            <div class="wrapper ms-3">
                                <p class="mb-0 mt-1 text-dark fw-semibold">{{item.name}}</p>
                                <small class="text-muted">{{item.position}}</small>
                            </div>
                            <div class="float-end ms-auto">
                                <div ngbDropdown class="btn-group ms-3 mb-0">
                                    <a ngbDropdownToggle aria-label="anchor" href="javascript:void(0)" class="option-dots no-caret" data-bs-toggle="dropdown" aria-expanded="false"><i class="fa fa-ellipsis-v"></i></a>
                                    <div ngbDropdownMenu class="dropdown-menu">
                                        <a class="dropdown-item" href="javascript:void(0)"><i class="fe fe-edit me-2 d-inline-flex"></i> Edit</a>
                                        <a class="dropdown-item" href="javascript:void(0)"><i class="fe fe-trash me-2 d-inline-flex"></i> Delete</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="card-body pt-0">
                            <div class="d-flex mb-3">
                                <svg class="svg-icon" xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 0 24 24" width="24"><path d="M0 0h24v24H0V0z" fill="none"/><path d="M20 8l-8 5-8-5v10h16zm0-2H4l8 4.99z" opacity=".3"/><path d="M4 20h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2zM20 6l-8 4.99L4 6h16zM4 8l8 5 8-5v10H4V8z"/></svg>
                                <div class="h6 mb-0 ms-3 mt-1 text-truncate">{{item.mail}}</div>
                            </div>
                            <div class="d-flex">
                                <svg class="svg-icon" xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 0 24 24" width="24"><path d="M0 0h24v24H0V0z" fill="none"/><path d="M15.2 18.21c1.21.41 2.48.67 3.8.76v-1.5c-.88-.07-1.75-.22-2.6-.45l-1.2 1.19zM6.54 5h-1.5c.09 1.32.35 2.59.75 3.79l1.2-1.21c-.24-.83-.39-1.7-.45-2.58zM14 8h5V5h-5z" opacity=".3"/><path d="M20 15.5c-1.25 0-2.45-.2-3.57-.57-.1-.03-.21-.05-.31-.05-.26 0-.51.1-.71.29l-2.2 2.2c-2.83-1.44-5.15-3.75-6.59-6.58l2.2-2.21c.28-.27.36-.66.25-1.01C8.7 6.45 8.5 5.25 8.5 4c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1 0 9.39 7.61 17 17 17 .55 0 1-.45 1-1v-3.5c0-.55-.45-1-1-1zM5.03 5h1.5c.07.88.22 1.75.46 2.59L5.79 8.8c-.41-1.21-.67-2.48-.76-3.8zM19 18.97c-1.32-.09-2.6-.35-3.8-.76l1.2-1.2c.85.24 1.72.39 2.6.45v1.51zM12 3v10l3-3h6V3h-9zm7 5h-5V5h5v3z"/></svg>
                                <div class="h6 mb-0 ms-3 mt-1 text-truncate">{{item.phone}}</div>
                            </div>
                        </div>
                        <div class="card-footer">
                            <div class="row mb-1">
                                <div class="col">
                                    Work Progress
                                </div>
                                <div class="col col-auto">
                                    <h6 class="mb-0 ms-4 fw-bold">{{item.progress}}%</h6>
                                </div>
                            </div>
                            <div class="progress progress-sm mb-0 mt-1">
                                <div class="progress-bar bg-primary" [style.width.%]="item.progress"></div>
                            </div>
                        </div>
                    </div>
                </div>
            }
            
        </div>
    </div>
 </div>
<!-- End:: row-1 -->
