<!-- app-header -->
<header class="app-header">
  <!-- Start::main-header-container -->
  <div class="main-header-container container-fluid">
    <!-- Start::header-content-left -->
    <div class="header-content-left">
      <!-- Start::header-element -->
      <div class="header-element">
        <div class="horizontal-logo">
          <a [routerLink]="['/dashboards/sales']" class="header-logo">
            <img
              src="./assets/images/brand-logos/desktop-logo.png"
              alt="logo"
              class="desktop-logo"
            />
            <img
              src="./assets/images/brand-logos/toggle-logo.png"
              alt="logo"
              class="toggle-logo"
            />
            <img
              src="./assets/images/brand-logos/desktop-dark.png"
              alt="logo"
              class="desktop-dark"
            />
            <img
              src="./assets/images/brand-logos/toggle-dark.png"
              alt="logo"
              class="toggle-dark"
            />
            <img
              src="./assets/images/brand-logos/desktop-white.png"
              alt="logo"
              class="desktop-white"
            />
            <img
              src="./assets/images/brand-logos/toggle-white.png"
              alt="logo"
              class="toggle-white"
            />
          </a>
        </div>
      </div>
      <!-- End::header-element -->

      <!-- Start::header-element -->
      <div class="header-element mx-lg-0 mx-2">
        <button
          type="button"
          class="header-link header-menu-toggle"
          [attr.aria-pressed]="menu.fijo"
          [attr.aria-label]="menu.fijo ? 'Menú fijado. Ocultarlo y mostrarlo solo al pasar el mouse' : 'Fijar el menú abierto'"
          [attr.title]="menu.fijo ? 'Ocultar menú (aparece al pasar el mouse)' : 'Fijar el menú abierto'"
          (click)="toggleSidebar()"
        >
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false">
            <rect x="3" y="4.5" width="18" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.7" />
            <path
              d="M6 4.5h3.5v15H6a3 3 0 0 1-3-3v-9a3 3 0 0 1 3-3Z"
              fill="currentColor"
              [attr.fill-opacity]="menu.fijo ? 0.85 : 0"
            />
            <line x1="9.5" y1="4.5" x2="9.5" y2="19.5" stroke="currentColor" stroke-width="1.7" />
          </svg>
        </button>
      </div>
      <!-- End::header-element -->

      <!-- Start::header-element (migas) -->
      <div class="header-element header-migas" *ngIf="migaActual">
        <span class="header-migas__grupo" *ngIf="migaActual.grupo">{{ migaActual.grupo }}</span>
        <span class="header-migas__separador" *ngIf="migaActual.grupo" aria-hidden="true">›</span>
        <span class="header-migas__actual">{{ migaActual.titulo }}</span>
      </div>
      <!-- End::header-element -->
    </div>
    <!-- End::header-content-left -->

    <!-- Start::header-content-right -->
    <div class="header-content-right">
      <!-- Start::header-element (fecha) -->
      <div class="header-element header-fecha" title="Fecha de hoy">
        <span class="header-fecha__punto" aria-hidden="true"></span>
        {{ hoy }}
      </div>
      <!-- End::header-element -->
      <!-- Start::header-element -->
      <div class="header-element header-buscar">
        <button
          type="button"
          class="header-buscar__boton"
          aria-label="Buscar pantalla (Ctrl+K)"
          aria-haspopup="dialog"
          (click)="paletteService.abrir()"
        >
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
            <circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2" />
            <line x1="15.5" y1="15.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
          <span class="header-buscar__texto">Buscar pantalla…</span>
          <kbd class="header-buscar__atajo" aria-hidden="true">Ctrl K</kbd>
        </button>
      </div>
      <!-- End::header-element -->

      

      <!-- Start::header-element -->
      <div class="header-element header-theme-mode">
        <button
          type="button"
          class="header-link layout-setting"
          [attr.aria-label]="localdata?.theme === 'dark' ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'"
          [attr.title]="localdata?.theme === 'dark' ? 'Tema claro' : 'Tema oscuro'"
          (click)="updateTheme(localdata?.theme === 'dark' ? 'light' : 'dark')"
        >
          <span class="light-layout"><i class="ri-moon-line header-link-icon" aria-hidden="true"></i></span>
          <span class="dark-layout"><i class="bi bi-brightness-high header-link-icon" aria-hidden="true"></i></span>
        </button>
      </div>
      <!-- End::header-element -->

      <!-- Start::header-element -->
      <div class="header-element header-fullscreen">
        <button
          type="button"
          class="header-link"
          [attr.aria-label]="isFullscreen ? 'Salir de pantalla completa' : 'Pantalla completa'"
          [attr.title]="isFullscreen ? 'Salir de pantalla completa' : 'Pantalla completa'"
          (click)="toggleFullscreen()"
        >
          <i class="ri-fullscreen-line full-screen-open header-link-icon" [ngClass]="{ 'd-none': isFullscreen }" aria-hidden="true"></i>
          <i class="ri-fullscreen-exit-fill full-screen-close header-link-icon d-none" [ngClass]="{ 'd-none': !isFullscreen }" aria-hidden="true"></i>
        </button>
      </div>
      <!-- End::header-element -->


    </div>
    <!-- End::header-content-right -->
  </div>
  <!-- End::main-header-container -->
</header>
<!-- /app-header -->
<!-- La búsqueda de pantallas ahora es <app-command-palette> (montada en content-layout), sobre CDK Overlay -->
