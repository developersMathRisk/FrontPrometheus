<div class="enc-fila">
    <div class="enc-texto">
        <p class="p-kicker" *ngIf="kicker">{{ kicker }}</p>
        <h1 class="p-title">{{ titulo }}</h1>
        <p class="p-sub" *ngIf="subtitulo">{{ subtitulo }}</p>
    </div>
    <div class="enc-acciones">
        <ng-content select="[acciones]"></ng-content>
    </div>
</div>
