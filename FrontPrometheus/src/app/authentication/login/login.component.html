<main class="acceso">
    <section class="acceso__marca" aria-hidden="true">
        <img src="./assets/images/brand-logos/prometheus-simbolo.png" alt="" class="acceso__simbolo" />
        <h2>Gestión de riesgos,<br />con trazabilidad total.</h2>
        <p>Cálculos, resultados y accesos de su organización en una sola plataforma, con el detalle a la vista.</p>
    </section>

    <section class="acceso__panel">
        <form class="acceso__form" (ngSubmit)="ingresar()" autocomplete="on" novalidate>
            <img src="./assets/images/brand-logos/prometheus-wordmark.png" alt="Prometheus" class="acceso__wordmark" />
            <h1>Iniciar sesión</h1>
            <p class="acceso__sub">Ingrese con su usuario corporativo.</p>

            <div class="alert alert-warning" role="status" *ngIf="aviso">{{ aviso }}</div>
            <div class="alert alert-danger" role="alert" *ngIf="error">{{ error }}</div>

            <label class="p-label" for="usuario">Usuario</label>
            <input id="usuario" name="username" class="form-control" [(ngModel)]="username" autocomplete="username"
                autocapitalize="off" spellcheck="false" autofocus required />

            <label class="p-label" for="clave">Contraseña</label>
            <div class="acceso__clave">
                <input id="clave" name="password" class="form-control" [type]="verClave ? 'text' : 'password'"
                    [(ngModel)]="password" autocomplete="current-password" required />
                <button type="button" class="acceso__ver" (click)="verClave = !verClave"
                    [attr.aria-label]="verClave ? 'Ocultar contraseña' : 'Mostrar contraseña'">
                    {{ verClave ? 'Ocultar' : 'Mostrar' }}
                </button>
            </div>

            <button type="submit" class="btn btn-primary acceso__enviar" [disabled]="cargando || !username.trim() || !password">
                {{ cargando ? 'Ingresando…' : 'Ingresar' }}
            </button>
            <p class="acceso__ayuda">¿Olvidó su contraseña? Solicite un restablecimiento al administrador.</p>
        </form>
    </section>
</main>
