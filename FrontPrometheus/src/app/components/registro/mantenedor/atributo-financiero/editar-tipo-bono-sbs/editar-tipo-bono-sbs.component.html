<app-modal-formulario titulo="Editar Tipo Bono" subtitulo="Modifique los datos del tipo de bono." accion="Guardar Cambios"
    [faltantes]="faltantes" [datos]="objRegistroEditado" [guardando]="guardando" (cerrar)="cerrar()" (guardar)="guardarCambios()">

    <fieldset class="hig-seccion">
        <legend>Identificación</legend>
        <div class="hig-cuadricula hig-columnas-3">
            <div class="hig-campo">
                <label class="form-label" for="tb-e-descripcionTipoBono">Descripción<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="tb-e-descripcionTipoBono" type="text" class="form-control" autocomplete="off" minlength="3" maxlength="50" [(ngModel)]="objRegistroEditado.descripcionTipoBono" required>
            </div>
        </div>
    </fieldset>

</app-modal-formulario>
