<app-modal-formulario titulo="Cargar Cálculo de Base de Interés" subtitulo="Registre una base de cálculo de interés para usarla en la convención de días de instrumentos de renta fija." accion="Registrar"
    [faltantes]="faltantes" [datos]="nuevoRegistro" [guardando]="guardando" (cerrar)="cerrar()" (guardar)="registrar()">

    <fieldset class="hig-seccion">
        <legend>Identificación</legend>
        <div class="hig-cuadricula hig-columnas-3">
            <div class="hig-campo">
                <label class="form-label" for="cbi-c-nombreCalculo">Nombre<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="cbi-c-nombreCalculo" type="text" class="form-control" autocomplete="off" placeholder="Ej. Actual/360" minlength="3" maxlength="100" [(ngModel)]="nuevoRegistro.nombreCalculo" required>
            </div>
            <div class="hig-campo">
                <label class="form-label" for="cbi-c-nombreCortoCalculo">Nombre Corto</label>
                <input id="cbi-c-nombreCortoCalculo" type="text" class="form-control" autocomplete="off" placeholder="Ej. ACT/360" minlength="3" maxlength="50" [(ngModel)]="nuevoRegistro.nombreCortoCalculo">
            </div>
            <div class="hig-campo">
                <label class="form-label" for="cbi-c-descripcionCalculoBase">Descripción</label>
                <input id="cbi-c-descripcionCalculoBase" type="text" class="form-control" autocomplete="off" placeholder="Descripción" minlength="3" maxlength="50" [(ngModel)]="nuevoRegistro.descripcionCalculoBase">
            </div>
        </div>
    </fieldset>

</app-modal-formulario>
