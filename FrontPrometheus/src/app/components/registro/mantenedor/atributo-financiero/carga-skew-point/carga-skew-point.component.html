<app-modal-formulario titulo="Cargar Skew Point" subtitulo="Registre un skew point para usarlo en instrumentos y reportes." accion="Registrar"
    [faltantes]="faltantes" [datos]="nuevoRegistro" [guardando]="guardando" (cerrar)="cerrar()" (guardar)="registrar()">

    <fieldset class="hig-seccion">
        <legend>Identificación</legend>
        <div class="hig-cuadricula hig-columnas-3">
            <div class="hig-campo">
                <label class="form-label" for="sp-c-point">Punto<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="sp-c-point" type="text" class="form-control" autocomplete="off" placeholder="Punto" minlength="3" maxlength="5" [(ngModel)]="nuevoRegistro.point" required>
            </div>
        </div>
    </fieldset>

</app-modal-formulario>
