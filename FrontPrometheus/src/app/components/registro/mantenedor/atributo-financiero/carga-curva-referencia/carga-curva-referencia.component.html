<app-modal-formulario titulo="Cargar Curva de Referencia" subtitulo="Registre una curva de referencia para usarla en instrumentos y reportes." accion="Registrar"
    [faltantes]="faltantes" [datos]="nuevoRegistro" [guardando]="guardando" (cerrar)="cerrar()" (guardar)="registrar()">

    <fieldset class="hig-seccion">
        <legend>Identificación</legend>
        <div class="hig-cuadricula hig-columnas-3">
            <div class="hig-campo">
                <label class="form-label" for="cr-c-nombreCurva">Nombre<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="cr-c-nombreCurva" type="text" class="form-control" autocomplete="off" placeholder="Nombre" minlength="3" maxlength="100" [(ngModel)]="nuevoRegistro.nombreCurva" required>
            </div>
            <div class="hig-campo">
                <label class="form-label" for="cr-c-nombreCortoCurva">Nombre Corto</label>
                <input id="cr-c-nombreCortoCurva" type="text" class="form-control" autocomplete="off" placeholder="Nombre Corto" minlength="3" maxlength="10" [(ngModel)]="nuevoRegistro.nombreCortoCurva">
            </div>
            <div class="hig-campo">
                <label class="form-label" for="cr-c-descripcionCurva">Descripción</label>
                <input id="cr-c-descripcionCurva" type="text" class="form-control" autocomplete="off" placeholder="Descripción" minlength="3" maxlength="500" [(ngModel)]="nuevoRegistro.descripcionCurva">
            </div>
        </div>
    </fieldset>

</app-modal-formulario>
