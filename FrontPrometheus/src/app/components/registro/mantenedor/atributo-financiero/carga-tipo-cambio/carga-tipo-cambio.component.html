<app-modal-formulario titulo="Cargar Tipo de Cambio" subtitulo="Registre un tipo de cambio para dejar constancia del valor de una moneda en una fecha de proceso." accion="Registrar"
    [faltantes]="faltantes" [datos]="nuevoRegistro" [guardando]="guardando" (cerrar)="cerrar()" (guardar)="registrar()">

    <fieldset class="hig-seccion">
        <legend>Identificación</legend>
        <div class="hig-cuadricula">
            <div class="hig-campo">
                <label class="form-label" for="tc-c-codFuenteDatos">Fuente de Datos<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="tc-c-codFuenteDatos" type="text" class="form-control" autocomplete="off" placeholder="Fuente de Datos" minlength="3" maxlength="3" [(ngModel)]="nuevoRegistro.codFuenteDatos" required>
            </div>
            <div class="hig-campo">
                <label class="form-label" for="tc-c-desTicker">Ticker<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="tc-c-desTicker" type="text" class="form-control" autocomplete="off" placeholder="Ticker" minlength="3" maxlength="20" [(ngModel)]="nuevoRegistro.desTicker" required>
            </div>
        </div>
    </fieldset>

    <fieldset class="hig-seccion">
        <legend>Valor</legend>
        <div class="hig-cuadricula">
            <div class="hig-campo">
                <label class="form-label" for="tc-c-fecProceso">Fecha de Proceso<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="tc-c-fecProceso" type="date" class="form-control" [(ngModel)]="nuevoRegistro.fecProceso" required>
            </div>
            <div class="hig-campo">
                <label class="form-label" for="tc-c-valor">Valor<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="tc-c-valor" type="number" class="form-control" autocomplete="off" placeholder="Valor" [(ngModel)]="nuevoRegistro.valor" required>
            </div>
        </div>
    </fieldset>

</app-modal-formulario>
