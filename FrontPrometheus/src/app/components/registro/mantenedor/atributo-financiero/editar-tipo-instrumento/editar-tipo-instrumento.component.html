<app-modal-formulario titulo="Editar Tipo de Instrumento" subtitulo="Modifique los datos del tipo de instrumento." accion="Guardar Cambios"
    [faltantes]="faltantes" [datos]="objRegistroEditado" [guardando]="guardando" (cerrar)="cerrar()" (guardar)="guardarCambios()">

    <fieldset class="hig-seccion">
        <legend>Identificación</legend>
        <div class="hig-cuadricula">
            <div class="hig-campo">
                <label class="form-label" for="ti-e-codTipoInstrumento">Código<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="ti-e-codTipoInstrumento" type="text" class="form-control" autocomplete="off" minlength="2" maxlength="20" [(ngModel)]="objRegistroEditado.codTipoInstrumento" required>
            </div>
            <div class="hig-campo">
                <label class="form-label" for="ti-e-descripcionTipoInstrumento">Descripción<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="ti-e-descripcionTipoInstrumento" type="text" class="form-control" autocomplete="off" minlength="3" maxlength="100" [(ngModel)]="objRegistroEditado.descripcionTipoInstrumento" required>
            </div>
        </div>
    </fieldset>

</app-modal-formulario>
