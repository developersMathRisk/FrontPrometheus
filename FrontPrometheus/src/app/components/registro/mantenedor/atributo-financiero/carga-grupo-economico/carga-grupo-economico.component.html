<app-modal-formulario titulo="Cargar Grupo Económico" subtitulo="Registre un grupo económico para agrupar emisores relacionados." accion="Registrar"
    [faltantes]="faltantes" [datos]="nuevoRegistro" [guardando]="guardando" (cerrar)="cerrar()" (guardar)="registrar()">

    <fieldset class="hig-seccion">
        <legend>Identificación</legend>
        <div class="hig-cuadricula hig-columnas-3">
            <div class="hig-campo">
                <label class="form-label" for="ge-c-nombreGrupo">Nombre<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="ge-c-nombreGrupo" type="text" class="form-control" autocomplete="off" placeholder="Nombre" minlength="3" maxlength="100" [(ngModel)]="nuevoRegistro.nombreGrupo" required>
            </div>
            <div class="hig-campo">
                <label class="form-label" for="ge-c-descripcion">Descripción<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="ge-c-descripcion" type="text" class="form-control" autocomplete="off" placeholder="Descripción" minlength="3" maxlength="500" [(ngModel)]="nuevoRegistro.descripcion" required>
            </div>
        </div>
    </fieldset>

</app-modal-formulario>
