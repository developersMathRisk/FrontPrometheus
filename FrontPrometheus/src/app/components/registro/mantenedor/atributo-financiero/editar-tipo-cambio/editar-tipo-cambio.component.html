<app-modal-formulario titulo="Editar Tipo de Cambio" subtitulo="Modifique los datos del tipo de cambio." accion="Guardar Cambios"
    [faltantes]="faltantes" [datos]="objRegistroEditado" [guardando]="guardando" (cerrar)="cerrar()" (guardar)="guardarCambios()">

    <fieldset class="hig-seccion">
        <legend>Identificación</legend>
        <div class="hig-cuadricula">
            <div class="hig-campo">
                <label class="form-label" for="tc-e-codFuenteDatos">Fuente de Datos<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="tc-e-codFuenteDatos" type="text" class="form-control" autocomplete="off" minlength="3" maxlength="3" [(ngModel)]="objRegistroEditado.codFuenteDatos" required>
            </div>
            <div class="hig-campo">
                <label class="form-label" for="tc-e-desTicker">Ticker<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="tc-e-desTicker" type="text" class="form-control" autocomplete="off" minlength="3" maxlength="20" [(ngModel)]="objRegistroEditado.desTicker" required>
            </div>
        </div>
    </fieldset>

    <fieldset class="hig-seccion">
        <legend>Valor</legend>
        <div class="hig-cuadricula">
            <div class="hig-campo">
                <label class="form-label" for="tc-e-fecProceso">Fecha de Proceso<span class="hig-requerido" aria-hidden="true">*</span></label>
                <app-date-picker id="tc-e-fecProceso" [(ngModel)]="objRegistroEditado.fecProceso"></app-date-picker>
            </div>
            <div class="hig-campo">
                <label class="form-label" for="tc-e-valor">Valor<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="tc-e-valor" type="number" class="form-control" autocomplete="off" [(ngModel)]="objRegistroEditado.valor" required>
            </div>
        </div>
    </fieldset>

</app-modal-formulario>
