<app-modal-formulario titulo="Cargar Tipo de Tasa" subtitulo="Registre un tipo de tasa de interés para clasificar instrumentos de renta fija." accion="Registrar"
    [faltantes]="faltantes" [datos]="nuevoRegistro" [guardando]="guardando" (cerrar)="cerrar()" (guardar)="registrar()">

    <fieldset class="hig-seccion">
        <legend>Identificación</legend>
        <div class="hig-cuadricula hig-columnas-3">
            <div class="hig-campo">
                <label class="form-label" for="tt-c-nombreTipoTasa">Nombre<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="tt-c-nombreTipoTasa" type="text" class="form-control" autocomplete="off" placeholder="Ej. Tasa Fija" minlength="3" maxlength="100" [(ngModel)]="nuevoRegistro.nombreTipoTasa" required>
            </div>
            <div class="hig-campo">
                <label class="form-label" for="tt-c-nombreCortoTipoTasa">Nombre Corto</label>
                <input id="tt-c-nombreCortoTipoTasa" type="text" class="form-control" autocomplete="off" placeholder="Ej. Fija" minlength="3" maxlength="50" [(ngModel)]="nuevoRegistro.nombreCortoTipoTasa">
            </div>
            <div class="hig-campo">
                <label class="form-label" for="tt-c-descripcionTipoTasa">Descripción</label>
                <input id="tt-c-descripcionTipoTasa" type="text" class="form-control" autocomplete="off" placeholder="Descripción" minlength="3" maxlength="500" [(ngModel)]="nuevoRegistro.descripcionTipoTasa">
            </div>
        </div>
    </fieldset>

</app-modal-formulario>
