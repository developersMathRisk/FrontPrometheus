<app-modal-formulario titulo="Editar Curva de Referencia" subtitulo="Modifique los datos de la curva de referencia." accion="Guardar Cambios"
    [faltantes]="faltantes" [datos]="objRegistroEditado" [guardando]="guardando" (cerrar)="cerrar()" (guardar)="guardarCambios()">

    <fieldset class="hig-seccion">
        <legend>Identificación</legend>
        <div class="hig-cuadricula hig-columnas-3">
            <div class="hig-campo">
                <label class="form-label" for="cr-e-nombreCurva">Nombre<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="cr-e-nombreCurva" type="text" class="form-control" autocomplete="off" minlength="3" maxlength="100" [(ngModel)]="objRegistroEditado.nombreCurva" required>
            </div>
            <div class="hig-campo">
                <label class="form-label" for="cr-e-nombreCortoCurva">Nombre Corto</label>
                <input id="cr-e-nombreCortoCurva" type="text" class="form-control" autocomplete="off" minlength="3" maxlength="10" [(ngModel)]="objRegistroEditado.nombreCortoCurva">
            </div>
            <div class="hig-campo">
                <label class="form-label" for="cr-e-descripcionCurva">Descripción</label>
                <input id="cr-e-descripcionCurva" type="text" class="form-control" autocomplete="off" minlength="3" maxlength="500" [(ngModel)]="objRegistroEditado.descripcionCurva">
            </div>
        </div>
    </fieldset>

</app-modal-formulario>
