<app-modal-formulario titulo="Cargar Sector" subtitulo="Registre un sector para clasificar instrumentos según su rubro económico." accion="Registrar"
    [faltantes]="faltantes" [datos]="nuevoRegistro" [guardando]="guardando" (cerrar)="cerrar()" (guardar)="registrar()">

    <fieldset class="hig-seccion">
        <legend>Identificación</legend>
        <div class="hig-cuadricula">
            <div class="hig-campo">
                <label class="form-label" for="se-c-nombreSector">Nombre<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="se-c-nombreSector" type="text" class="form-control" autocomplete="off" placeholder="Nombre" minlength="3" maxlength="100" [(ngModel)]="nuevoRegistro.nombreSector" required>
            </div>
            <div class="hig-campo">
                <label class="form-label" for="se-c-descripcion">Descripción<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="se-c-descripcion" type="text" class="form-control" autocomplete="off" placeholder="Descripción" minlength="3" maxlength="500" [(ngModel)]="nuevoRegistro.descripcion" required>
            </div>
        </div>
    </fieldset>

</app-modal-formulario>
