<app-modal-formulario titulo="Editar Tipo de Emisión" subtitulo="Modifique los datos del tipo de emisión." accion="Guardar Cambios"
    [faltantes]="faltantes" [datos]="objRegistroEditado" [guardando]="guardando" (cerrar)="cerrar()" (guardar)="guardarCambios()">

    <fieldset class="hig-seccion">
        <legend>Identificación</legend>
        <div class="hig-cuadricula hig-columnas-3">
            <div class="hig-campo">
                <label class="form-label" for="te-e-nombreEmision">Nombre<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="te-e-nombreEmision" type="text" class="form-control" autocomplete="off" minlength="3" maxlength="100" [(ngModel)]="objRegistroEditado.nombreEmision" required>
            </div>
            <div class="hig-campo">
                <label class="form-label" for="te-e-nombreCorto">Nombre Corto</label>
                <input id="te-e-nombreCorto" type="text" class="form-control" autocomplete="off" minlength="3" maxlength="10" [(ngModel)]="objRegistroEditado.nombreCorto">
            </div>
            <div class="hig-campo">
                <label class="form-label" for="te-e-descripcion">Descripción<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="te-e-descripcion" type="text" class="form-control" autocomplete="off" minlength="3" maxlength="500" [(ngModel)]="objRegistroEditado.descripcion" required>
            </div>
        </div>
    </fieldset>

</app-modal-formulario>
