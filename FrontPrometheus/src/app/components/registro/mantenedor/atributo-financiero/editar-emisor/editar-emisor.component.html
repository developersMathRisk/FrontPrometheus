<div id="myModal" tabindex="-1" data-keyboard="false" role="dialog">
    <div role="document" class="msg_card_body" style="width: 100%;">
        <div class="modal-header">
            <table style="width: 100%;">
                <tr style="width: 100%;">
                    <td style="text-align: left; padding: 0% 0% 0.5% 1%;">
                        <h3 class="modal-title">Editar Emisor</h3>
                    </td>
                    <td style="text-align: right; padding-right: 1.3%;">
                        <button type="button" class="icon-close" (click)="cerrar()">
                            <mat-icon>close</mat-icon>
                        </button>
                    </td>
                </tr>
            </table>
        </div>
    </div>

    <div class="card">
        <!-- <div class="card-header justify-content-between d-sm-flex d-block">
            <div class="card-title">
                Datos Generales
            </div>
        </div> -->
        <div class="card-body">
            <div class="row">
                <div class="col-md-3">
                    <label class="form-label">Código</label>
                    <input type="text" placeholder="Código" minlength="4" maxlength="4" class="form-control" [(ngModel)]="this.objRegistroEditado.codEmisor">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Cod. IDC Cliente</label>
                    <input type="number" placeholder="Cod. IDC Cliente" minlength="2" maxlength="9" class="form-control" [(ngModel)]="this.objRegistroEditado.codIDCCliente">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Nombre</label>
                    <input type="text" placeholder="Nombre" minlength="2" maxlength="100" class="form-control" [(ngModel)]="this.objRegistroEditado.nomEmisor">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Tipo Emisor</label>
                    <input type="text" placeholder="Tipo Emisor" minlength="3" maxlength="3" class="form-control" [(ngModel)]="this.objRegistroEditado.codTipoEmisor">
                </div>
            </div>

            <br>

            <div class="row">
                <div class="col-md-3">
                    <label class="form-label">Detalle</label>
                    <input type="text" placeholder="Detalle" minlength="4" maxlength="100" class="form-control" [(ngModel)]="this.objRegistroEditado.detalle">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Ámbito</label>
                    <input type="text" placeholder="Ámbito" minlength="2" maxlength="2" class="form-control" [(ngModel)]="this.objRegistroEditado.ambito">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Cod. Bloomberg</label>
                    <input type="text" placeholder="Cod. Bloomberg" minlength="4" maxlength="20" class="form-control" [(ngModel)]="this.objRegistroEditado.codBloomberg">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Thres Hold</label>
                    <input type="number" placeholder="Thres Hold" class="form-control" [(ngModel)]="this.objRegistroEditado.numThresHold">
                </div>
            </div>

            <br>

            <div class="row">
                <div class="col-md-4">
                    <label class="form-label">País</label>
                    <div class="combo-contenedor">
                        <ng-select placeholder="Seleccione una opción..." [items]="listPais" bindLabel="desPais" bindValue="idPais" [(ngModel)]="this.objRegistroEditado.idPais"></ng-select>
                        <button class="btn btn-outline-primary btn-wave btn-agregar" (click)="abrirModalSecundario(cargaModalPais)"><span class="icon">+</span></button>
                    </div>
                </div>
            </div>

            <br>

            <div class="row">
                <div class="col-md-3">
                    <div class="form-check"><input type="checkbox" class="form-check-input" id="chkEmiReport" name="chkEmiReport" [(ngModel)]="this.objRegistroEditado.flgEmiReport"><label for="chkEmiReport" class="form-check-label"> Emite Reporte </label></div>
                </div>
                <div class="col-md-3">
                    <div class="form-check"><input type="checkbox" class="form-check-input" id="chkOrgaMulti" name="chkOrgaMulti" [(ngModel)]="this.objRegistroEditado.flgOrgaMulti"><label for="chkOrgaMulti" class="form-check-label"> Organismo Multilateral </label></div>
                </div>
                <div class="col-md-3">
                    <div class="form-check"><input type="checkbox" class="form-check-input" id="chkContratoMarco" name="chkContratoMarco" [(ngModel)]="this.objRegistroEditado.flgContratoMarco"><label for="chkContratoMarco" class="form-check-label"> Contrato Marco </label></div>
                </div>
                <div class="col-md-3">
                    <div class="form-check"><input type="checkbox" class="form-check-input" id="chkContratoEspecifico" name="chkContratoEspecifico" [(ngModel)]="this.objRegistroEditado.flgContratoEspecifico"><label for="chkContratoEspecifico" class="form-check-label"> Contrato Específico </label></div>
                </div>
            </div>

            <br>

            <div class="row">
                <div class="col-md-3">
                    <label class="form-label">Cod. SBS</label>
                    <input type="text" placeholder="Cod. SBS" minlength="4" maxlength="20" class="form-control" [(ngModel)]="this.objRegistroEditado.codSBS">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Cod. RUC</label>
                    <input type="text" placeholder="Cod. RUC" minlength="4" maxlength="20" class="form-control" [(ngModel)]="this.objRegistroEditado.codRUC">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Fuente</label>
                    <input type="text" placeholder="Fuente" minlength="3" maxlength="3" class="form-control" [(ngModel)]="this.objRegistroEditado.codFuente">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Tipo Emisor Anx8</label>
                    <input type="text" placeholder="Tipo Emisor Anx8" minlength="3" maxlength="3" class="form-control" [(ngModel)]="this.objRegistroEditado.codTipoEmisorAnx8">
                </div>
            </div>
        </div>
        <div class="card-footer">
            <button type="submit" class="btn btn-primary" (click)="guardarCambios()">Guardar Cambios</button>
            <br>
        </div>
</div>

<ng-template #cargaModalPais let-modal>
    <app-carga-pais (close)="cerrarModalSecundario($event)"></app-carga-pais>
</ng-template>
