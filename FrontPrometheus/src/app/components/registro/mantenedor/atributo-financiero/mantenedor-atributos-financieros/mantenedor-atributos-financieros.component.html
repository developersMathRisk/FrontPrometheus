<div class="page-header dashboard-pageheader d-flex justify-content-between align-items-center">
    <div class="d-flex flex-column">
        <h1 class="page-title my-auto">Atributos Financieros</h1>
        <p class="hig-subtitulo">Catálogos de referencia usados por instrumentos, factores y portafolios.</p>
    </div>
</div>

<div class="card">
    <div class="card-body atrfin-selector">
        <label class="form-label mb-0" for="atrfin-select">Atributo a administrar</label>
        <ng-select id="atrfin-select" class="atrfin-selector__combo" [items]="listaProductos" bindLabel="descripcion"
            bindValue="id" [clearable]="false" [(ngModel)]="productoSeleccionado"></ng-select>
    </div>
</div>

<div class="card">
    <div class="card-body">
        <ng-container *ngIf="componenteSeleccionado">
            <ng-container *ngComponentOutlet="componenteSeleccionado"></ng-container>
        </ng-container>
    </div>
</div>
