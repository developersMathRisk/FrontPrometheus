<app-modal-formulario titulo="Cargar Método Amortización" subtitulo="Registre un método de amortización para calcular el cronograma de pagos de un instrumento." accion="Registrar"
    [faltantes]="faltantes" [datos]="nuevoRegistro" [guardando]="guardando" (cerrar)="cerrar()" (guardar)="registrar()">

    <fieldset class="hig-seccion">
        <legend>Identificación</legend>
        <div class="hig-cuadricula hig-columnas-3">
            <div class="hig-campo">
                <label class="form-label" for="ma-c-nombreMetodo">Nombre<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="ma-c-nombreMetodo" type="text" class="form-control" autocomplete="off" placeholder="Nombre" minlength="3" maxlength="100" [(ngModel)]="nuevoRegistro.nombreMetodo" required>
            </div>
            <div class="hig-campo">
                <label class="form-label" for="ma-c-nombreCortoMetodo">Nombre Corto</label>
                <input id="ma-c-nombreCortoMetodo" type="text" class="form-control" autocomplete="off" placeholder="Nombre Corto" minlength="3" maxlength="10" [(ngModel)]="nuevoRegistro.nombreCortoMetodo">
            </div>
            <div class="hig-campo">
                <label class="form-label" for="ma-c-descripcionMetodo">Descripción<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="ma-c-descripcionMetodo" type="text" class="form-control" autocomplete="off" placeholder="Descripción" minlength="3" maxlength="500" [(ngModel)]="nuevoRegistro.descripcionMetodo" required>
            </div>
        </div>
    </fieldset>

</app-modal-formulario>
