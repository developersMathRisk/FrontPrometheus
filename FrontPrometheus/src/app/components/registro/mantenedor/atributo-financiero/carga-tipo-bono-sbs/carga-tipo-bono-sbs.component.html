<app-modal-formulario titulo="Cargar Tipo Bono" subtitulo="Registre un tipo de bono conforme a la clasificación de la SBS." accion="Registrar"
    [faltantes]="faltantes" [datos]="nuevoRegistro" [guardando]="guardando" (cerrar)="cerrar()" (guardar)="registrar()">

    <fieldset class="hig-seccion">
        <legend>Identificación</legend>
        <div class="hig-cuadricula hig-columnas-3">
            <div class="hig-campo">
                <label class="form-label" for="tb-c-descripcionTipoBono">Descripción<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="tb-c-descripcionTipoBono" type="text" class="form-control" autocomplete="off" placeholder="Descripción" minlength="3" maxlength="50" [(ngModel)]="nuevoRegistro.descripcionTipoBono" required>
            </div>
        </div>
    </fieldset>

</app-modal-formulario>
