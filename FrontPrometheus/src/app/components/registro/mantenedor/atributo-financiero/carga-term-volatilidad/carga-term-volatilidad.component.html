<app-modal-formulario titulo="Cargar Term. Volatilidad" subtitulo="Registre un term. volatilidad para usarlo en instrumentos y reportes." accion="Registrar"
    [faltantes]="faltantes" [datos]="nuevoRegistro" [guardando]="guardando" (cerrar)="cerrar()" (guardar)="registrar()">

    <fieldset class="hig-seccion">
        <legend>Identificación</legend>
        <div class="hig-cuadricula hig-columnas-3">
            <div class="hig-campo">
                <label class="form-label" for="tv-c-descripcionTermVolatility">Descripción<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="tv-c-descripcionTermVolatility" type="text" class="form-control" autocomplete="off" placeholder="Descripción" minlength="3" maxlength="50" [(ngModel)]="nuevoRegistro.descripcionTermVolatility" required>
            </div>
            <div class="hig-campo">
                <label class="form-label" for="tv-c-code">Código<span class="hig-requerido" aria-hidden="true">*</span></label>
                <input id="tv-c-code" type="text" class="form-control" autocomplete="off" placeholder="Código" minlength="3" maxlength="10" [(ngModel)]="nuevoRegistro.code" required>
            </div>
        </div>
    </fieldset>

</app-modal-formulario>
