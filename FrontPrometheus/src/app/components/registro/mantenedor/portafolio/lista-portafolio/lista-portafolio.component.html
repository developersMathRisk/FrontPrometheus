<form novalidate="" class="row g-3 mt-0 ng-untouched ng-pristine ng-valid">
    <div class="card">
        <div class="card-header justify-content-between d-sm-flex d-block">
            <div class="card-title d-flex align-items-center">
                <label for="select-producto">Mantenedor de Portafolios</label>
            </div>
        </div>
        <div class="card-body">
            <div>
    <button type="submit" class="btn btn-primary" (click)="registrar(cargaModal)">Agregar Portafolio</button>
</div>

<br>

<div id="mat-sorting">
    <div class="mat-elevation-z8">
        <div class="table-responsive">
            <table mat-table [dataSource]="dataSource" matSort #sort="matSort">

                <ng-container matColumnDef="idPortafolio">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
                    <td mat-cell *matCellDef="let element"> {{element.idPortafolio}} </td>
                </ng-container>

                <ng-container matColumnDef="codPortafolio">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Código</th>
                    <td mat-cell *matCellDef="let element"> {{element.codPortafolio}} </td>
                </ng-container>

                <ng-container matColumnDef="descripcionPortafolio">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Descripción</th>
                    <td mat-cell *matCellDef="let element"> {{element.descripcionPortafolio}} </td>
                </ng-container>

                <ng-container matColumnDef="limite">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Límite</th>
                    <td mat-cell *matCellDef="let element"> {{element.limite}} </td>
                </ng-container>

                <ng-container matColumnDef="gestor">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Gestor</th>
                    <td mat-cell *matCellDef="let element"> {{element.gestor}} </td>
                </ng-container>

                <ng-container matColumnDef="tipoPortafolio">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Tipo</th>
                    <td mat-cell *matCellDef="let element"> {{element.tipoPortafolio}} </td>
                </ng-container>

                <ng-container matColumnDef="desMoneda">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Moneda</th>
                    <td mat-cell *matCellDef="let element"> {{element.desMoneda}} </td>
                </ng-container>

                <ng-container matColumnDef="descripcionBenchmark">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Benchmark</th>
                    <td mat-cell *matCellDef="let element"> {{element.descripcionBenchmark}} </td>
                </ng-container>

                <ng-container matColumnDef="notas">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Notas</th>
                    <td mat-cell *matCellDef="let element"> {{element.notas}} </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;" (contextmenu)="onContextMenu($event, row)"></tr>
            </table>
        </div>
        <mat-paginator #paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons>
        </mat-paginator>
    </div>

</div>
        </div>
    </div>
</form>

<div style="visibility: hidden; position: fixed"
    [style.left]="contextMenuPosition.x"
    [style.top]="contextMenuPosition.y"
    [matMenuTriggerFor]="contextMenu">
</div>

<mat-menu #contextMenu="matMenu">
    <ng-template matMenuContent let-item="item">
        <button mat-menu-item (click)="editar(selectedRow, editarModal)">
            <mat-icon>edit</mat-icon> Editar
        </button>
        <button mat-menu-item (click)="eliminar(selectedRow)">
            <mat-icon>delete</mat-icon> Eliminar
        </button>
    </ng-template>
</mat-menu>

<ng-template #cargaModal let-modal>
    <app-carga-portafolio (close)="cerrarModal($event)"></app-carga-portafolio>
</ng-template>

<ng-template #editarModal let-modal>
    <app-editar-portafolio (close)="cerrarModal($event)" [data]="filaEditar"></app-editar-portafolio>
</ng-template>
