<div id="myModal" tabindex="-1" data-keyboard="false" role="dialog">
    <div role="document" class="msg_card_body" style="width: 100%;">
        <div class="modal-header">
            <table style="width: 100%;">
                <tr style="width: 100%;">
                    <td style="text-align: left; padding: 0% 0% 0.5% 1%;">
                        <h3 class="modal-title">Cargar Bono</h3>
                    </td>
                    <td style="text-align: right; padding-right: 1.3%;">
                        <button type="button" class="icon-close" (click)="cerrar()">
                            <mat-icon>close</mat-icon>
                        </button>
                    </td>
                </tr>
            </table>
        </div>
    </div>

    <div class="card">
        <!-- <div class="card-header justify-content-between d-sm-flex d-block">
            <div class="card-title">
                Datos Generales
            </div>
        </div> -->
        <div class="card-body">
            <div class="row">
                <div class="col-md-4">
                    <label class="form-label">Código ISIN</label>
                    <input type="text" placeholder="Código ISIN" minlength="3" maxlength="20" class="form-control" [(ngModel)]="this.nuevoRegistro.codISIN">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Ticker</label>
                    <input type="text" placeholder="Ticker" minlength="3" maxlength="20" class="form-control" [(ngModel)]="this.nuevoRegistro.ticker">
                </div>
            </div>

            <br>

            <div class="row">
                <div class="col-md-4">
                    <label class="form-label">Nominal</label>
                    <input type="number" placeholder="Nominal" class="form-control" [(ngModel)]="this.nuevoRegistro.montoNominal">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Tasa Cupón</label>
                    <input type="number" placeholder="Tasa Cupón" class="form-control" [(ngModel)]="this.nuevoRegistro.tasaCupon">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Spread</label>
                    <input type="number" placeholder="Spread" class="form-control" [(ngModel)]="this.nuevoRegistro.spread">
                </div>
            </div>

            <br>

            <div class="row">
                <div class="col-md-4">
                    <label class="form-label">Fecha Emisión</label>
                    <input type="date" class="form-control" [(ngModel)]="this.nuevoRegistro.fechaEmision">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Fecha Vencimiento</label>
                    <input type="date" class="form-control" [(ngModel)]="this.nuevoRegistro.fechaVencimiento">
                </div>
            </div>

            <br>

            <div class="row">

                <div class="col-md-4">
                    <label class="form-label">Emisor</label>
                    <div class="combo-contenedor">
                        <ng-select placeholder="Seleccione una opción..." [items]="listEmisor" bindLabel="nomEmisor" bindValue="idEmisor" [(ngModel)]="this.nuevoRegistro.idEmisor"></ng-select>
                        <button class="btn btn-outline-primary btn-wave btn-agregar" (click)="abrirModalSecundario(cargaModalEmisor)"><span class="icon">+</span></button>
                    </div>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Moneda</label>
                    <div class="combo-contenedor">
                        <ng-select placeholder="Seleccione una opción..." [items]="listMoneda" bindLabel="desMoneda" bindValue="idMoneda" [(ngModel)]="this.nuevoRegistro.idMoneda"></ng-select>
                        <button class="btn btn-outline-primary btn-wave btn-agregar" (click)="abrirModalSecundario(cargaModalMoneda)"><span class="icon">+</span></button>
                    </div>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Tipo Bono</label>
                    <div class="combo-contenedor">
                        <ng-select placeholder="Seleccione una opción..." [items]="listTipoBonoSBS" bindLabel="descripcionTipoBono" bindValue="idTipoBono" [(ngModel)]="this.nuevoRegistro.idTipoBono"></ng-select>
                        <button class="btn btn-outline-primary btn-wave btn-agregar" (click)="abrirModalSecundario(cargaModalTipoBono)"><span class="icon">+</span></button>
                    </div>
                </div>
            </div>

            <br>

            <div class="row">
                <div class="col-md-4">
                    <label class="form-label">Curva Referencia</label>
                    <div class="combo-contenedor">
                        <ng-select placeholder="Seleccione una opción..." [items]="listCurvaReferencia" bindLabel="descripcionCurva" bindValue="idCurvaReferencia" [(ngModel)]="this.nuevoRegistro.idCurvaReferencia"></ng-select>
                        <button class="btn btn-outline-primary btn-wave btn-agregar" (click)="abrirModalSecundario(cargaModalCurvaReferencia)"><span class="icon">+</span></button>
                    </div>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Método Amortización</label>
                    <div class="combo-contenedor">
                        <ng-select placeholder="Seleccione una opción..." [items]="listMetodoAmotizacion" bindLabel="descripcionMetodo" bindValue="idMetodoAmortizacion" [(ngModel)]="this.nuevoRegistro.idMetodoAmortizacion"></ng-select>
                        <button class="btn btn-outline-primary btn-wave btn-agregar" (click)="abrirModalSecundario(cargaModalMetodoAmortizacion)"><span class="icon">+</span></button>
                    </div>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Cálculo Base</label>
                    <div class="combo-contenedor">
                        <ng-select placeholder="Seleccione una opción..." [items]="listCalculoBase" bindLabel="descripcionCalculoBase" bindValue="idCalculobase" [(ngModel)]="this.nuevoRegistro.idCalculobase"></ng-select>
                        <button class="btn btn-outline-primary btn-wave btn-agregar" (click)="abrirModalSecundario(cargaModalCalculoBase)"><span class="icon">+</span></button>
                    </div>
                </div>
            </div>

            <br>

            <div class="row">

                <div class="col-md-4">
                    <label class="form-label">Frecuencia Pago</label>
                    <div class="combo-contenedor">
                        <ng-select placeholder="Seleccione una opción..." [items]="listFrecPago" bindLabel="descripcionFrecuencia" bindValue="idFrecuenciaPago" [(ngModel)]="this.nuevoRegistro.idFrecuenciaPago"></ng-select>
                        <button class="btn btn-outline-primary btn-wave btn-agregar" (click)="abrirModalSecundario(cargaModalFrecuenciaPago)"><span class="icon">+</span></button>
                    </div>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Tipo Tasa Interés</label>
                    <div class="combo-contenedor">
                        <ng-select placeholder="Seleccione una opción..." [items]="listTipoTasaInt" bindLabel="descripcionTipoTasa" bindValue="idTipoTasaInteres" [(ngModel)]="this.nuevoRegistro.idTipoTasaInteres"></ng-select>
                        <button class="btn btn-outline-primary btn-wave btn-agregar" (click)="abrirModalSecundario(cargaModalTipoTasaInteres)"><span class="icon">+</span></button>
                    </div>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Fórmula Tasa</label>
                    <div class="combo-contenedor">
                        <ng-select placeholder="Seleccione una opción..." [items]="listFormulaTasa" bindLabel="descripcionFormula" bindValue="idFormulaTasa" [(ngModel)]="this.nuevoRegistro.idFormulaTasa"></ng-select>
                        <button class="btn btn-outline-primary btn-wave btn-agregar" (click)="abrirModalSecundario(cargaModalFormulaTasa)"><span class="icon">+</span></button>
                    </div>
                </div>

            </div>

            <br>

            <div class="row">
                <div class="col-md-4">
                    <div class="form-check"><input type="checkbox" class="form-check-input" id="chkCargaAutomatica" name="chkCargaAutomatica" [(ngModel)]="this.flgAutomatico"><label for="chkCargaAutomatica" class="form-check-label"> Carga de cuponera automática </label></div>
                </div>
            </div>

        </div>

        <div class="card-footer">
            <button type="submit" class="btn btn-primary" (click)="registrar(cargaBonoCupon)">Registrar</button>
            <br>
        </div>
    </div>
</div>

<ng-template #cargaModalEmisor let-modal>
    <app-carga-emisor (close)="cerrarModalSecundario($event)"></app-carga-emisor>
</ng-template>
<ng-template #cargaModalMoneda let-modal>
    <app-carga-moneda (close)="cerrarModalSecundario($event)"></app-carga-moneda>
</ng-template>
<ng-template #cargaModalTipoBono let-modal>
    <app-carga-tipo-bono-sbs (close)="cerrarModalSecundario($event)"></app-carga-tipo-bono-sbs>
</ng-template>
<ng-template #cargaModalCurvaReferencia let-modal>
    <app-carga-curva-referencia (close)="cerrarModalSecundario($event)"></app-carga-curva-referencia>
</ng-template>
<ng-template #cargaModalMetodoAmortizacion let-modal>
    <app-carga-metodo-amortizacion (close)="cerrarModalSecundario($event)"></app-carga-metodo-amortizacion>
</ng-template>
<ng-template #cargaModalCalculoBase let-modal>
    <app-carga-calculo-base-interes (close)="cerrarModalSecundario($event)"></app-carga-calculo-base-interes>
</ng-template>
<ng-template #cargaModalFrecuenciaPago let-modal>
    <app-carga-frecuencia-pago (close)="cerrarModalSecundario($event)"></app-carga-frecuencia-pago>
</ng-template>
<ng-template #cargaModalTipoTasaInteres let-modal>
    <app-carga-tipo-tasa (close)="cerrarModalSecundario($event)"></app-carga-tipo-tasa>
</ng-template>
<ng-template #cargaModalFormulaTasa let-modal>
    <app-carga-formula-tasa (close)="cerrarModalSecundario($event)"></app-carga-formula-tasa>
</ng-template>

<ng-template #cargaBonoCupon let-modal>
    <app-carga-bono-cupon (close)="cerrarModalSecundario($event)" [data]="this.nuevoRegistro"></app-carga-bono-cupon>
</ng-template>
