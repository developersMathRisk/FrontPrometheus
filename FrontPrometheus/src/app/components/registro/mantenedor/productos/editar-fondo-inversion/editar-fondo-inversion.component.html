<div id="myModal" tabindex="-1" data-keyboard="false" role="dialog">
    <div role="document" class="msg_card_body" style="width: 100%;">
        <div class="modal-header">
            <table style="width: 100%;">
                <tr style="width: 100%;">
                    <td style="text-align: left; padding: 0% 0% 0.5% 1%;">
                        <h3 class="modal-title">Editar Fondo de Inversión (ID: {{data.idFondo}})</h3>
                    </td>
                    <td style="text-align: right; padding-right: 1.3%;">
                        <button type="button" class="icon-close" (click)="cerrar()">
                            <mat-icon>close</mat-icon>
                        </button>
                    </td>
                </tr>
            </table>
        </div>
    </div>

    <div class="card">
        <!-- <div class="card-header justify-content-between d-sm-flex d-block">
            <div class="card-title">
                Datos Generales
            </div>
        </div> -->
        <div class="card-body">
            <div class="row">
                <div class="col-md-3">
                    <label class="form-label">Código ISIN</label>
                    <input type="text" placeholder="Código ISIN" minlength="3" maxlength="20" class="form-control" [(ngModel)]="this.objRegistroEditado.codISIN">
                </div>

                <div class="col-md-3">
                    <label class="form-label">Ticker (BLG o Interno)</label>
                    <input type="text" placeholder="Ticker" minlength="3" maxlength="20" class="form-control" [(ngModel)]="this.objRegistroEditado.codTicker">
                </div>

                <div class="col-md-3">
                    <label class="form-label">Nemónico</label>
                    <input type="text" placeholder="Nemónico" minlength="3" maxlength="20" class="form-control" [(ngModel)]="this.objRegistroEditado.desNemonico">
                </div>

                <div class="col-md-3">
                    <label class="form-label">Monto Total</label>
                    <input type="number" placeholder="Monto Total" minlength="3" maxlength="20" class="form-control" [(ngModel)]="this.objRegistroEditado.montoTotal">
                </div>
            </div>

            <br>

            <div class="row">
                <div class="col-md-4">
                    <label class="form-label">Plaza</label>
                    <ng-select placeholder="Seleccione una opción..." [items]="listPlaza" bindLabel="desPlaza" bindValue="idPlaza" [(ngModel)]="this.objRegistroEditado.idPlaza"></ng-select>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Emisor</label>
                    <ng-select placeholder="Seleccione una opción..." [items]="listEmisor" bindLabel="nomEmisor" bindValue="idEmisor" [(ngModel)]="this.objRegistroEditado.idEmisor"></ng-select>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Moneda</label>
                    <ng-select placeholder="Seleccione una opción..." [items]="listMoneda" bindLabel="desMoneda" bindValue="idMoneda" [(ngModel)]="this.objRegistroEditado.idMoneda"></ng-select>
                </div>
            </div>  
            
            <br>

            <div class="row">
                <div class="col-md-4">
                    <label class="form-label">Tipo Fondo</label>
                    <ng-select placeholder="Seleccione una opción..." [items]="listTipoFondo" bindLabel="desTipoFondo" bindValue="idTipoFondo" [(ngModel)]="this.objRegistroEditado.idTipoFondo"></ng-select>
                </div>

                <div class="col-md-4" *ngIf="this.objRegistroEditado.flgCargaAutom">
                    <label class="form-label">Fuente Información</label>
                    <ng-select placeholder="Seleccione una opción..." [items]="listFuenteInformacion" bindLabel="desFuenteInformacion" bindValue="idFuenteInformacion" [(ngModel)]="this.objRegistroEditado.idFuenteInformacion"></ng-select>
                </div>
            </div>

            <br>

            <div class="row">
                <div class="col-md-4">
                    <div class="form-check"><input type="checkbox" class="form-check-input" id="chkCargaAutomatica" name="chkCargaAutomatica" [(ngModel)]="this.objRegistroEditado.flgCargaAutom"><label for="chkCargaAutomatica" class="form-check-label"> Carga Automática </label></div>
                </div>
                <div class="col-md-4">
                    <div class="form-check"><input type="checkbox" class="form-check-input" id="chkCalculoVaR" name="chkCalculoVaR" [(ngModel)]="this.objRegistroEditado.flgVar"><label for="chkCalculoVaR" class="form-check-label"> Cálculo de VaR </label></div>
                </div>
            </div>
        </div>

        <div class="card-footer">
            <button type="submit" class="btn btn-primary" (click)="guardarCambios()">Guardar Cambios</button>
            <br>
        </div>
    </div>
</div>
