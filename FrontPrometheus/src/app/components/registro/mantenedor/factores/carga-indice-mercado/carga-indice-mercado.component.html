<app-modal-formulario titulo="Cargar Índice de Mercado" subtitulo="Registre un índice de referencia del mercado." accion="Registrar"
    [faltantes]="faltantes" [datos]="nuevoRegistro" (cerrar)="cerrar()" (guardar)="registrar()">

        <fieldset class="hig-seccion">
            <legend>Índice</legend>
            <div class="hig-cuadricula hig-columnas-1">
                <div class="hig-campo">
                    <label class="form-label" for="im-c-codigo">Código<span class="hig-requerido" aria-hidden="true">*</span></label>
                    <input id="im-c-codigo" type="text" class="form-control" autocomplete="off" maxlength="6" [(ngModel)]="this.nuevoRegistro.codigo" required>
                </div>
            </div>
        </fieldset>

</app-modal-formulario>
