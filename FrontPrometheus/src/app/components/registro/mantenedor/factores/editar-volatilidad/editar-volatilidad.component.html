<div id="myModal" tabindex="-1" data-keyboard="false" role="dialog">
    <div role="document" class="msg_card_body" style="width: 100%;">
        <div class="modal-header">
            <table style="width: 100%;">
                <tr style="width: 100%;">
                    <td style="text-align: left; padding: 0% 0% 0.5% 1%;">
                        <h3 class="modal-title">Editar Volatilidad</h3>
                    </td>
                    <td style="text-align: right; padding-right: 1.3%;">
                        <button type="button" class="icon-close" (click)="cerrar()">
                            <mat-icon>close</mat-icon>
                        </button>
                    </td>
                </tr>
            </table>
        </div>
    </div>

    <div class="card">
        <!-- <div class="card-header justify-content-between d-sm-flex d-block">
            <div class="card-title">
                Datos Generales
            </div>
        </div> -->
        <div class="card-body">
            <div class="row">
                <div class="col-md-6">
                    <label class="form-label">Fecha Proceso</label>
                    <input type="date" class="form-control" [(ngModel)]="this.objRegistroEditado.fecProceso">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Valor</label>
                    <input type="number" placeholder="Valor" minlength="1" maxlength="6" class="form-control" [(ngModel)]="this.objRegistroEditado.valor">
                </div>
            </div>
            <br>
            <div class="row">
                <div class="col-md-4">
                    <label class="form-label">Term. Volatilidad</label>
                    <div class="combo-contenedor">
                        <ng-select placeholder="Seleccione una opción..." [items]="listTermVolatilidad" bindLabel="descripcionTermVolatility" bindValue="idTermVolatility" [(ngModel)]="this.objRegistroEditado.idTermVolatility"></ng-select>
                        <button class="btn btn-outline-primary btn-wave btn-agregar" (click)="abrirModalSecundario(cargaModalTermVolatility)"><span class="icon">+</span></button>
                    </div>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Skew Point</label>
                    <div class="combo-contenedor">
                        <ng-select placeholder="Seleccione una opción..." [items]="listSkewPoint" bindLabel="point" bindValue="idSwekPoint" [(ngModel)]="this.objRegistroEditado.idSwekPoint"></ng-select>
                        <button class="btn btn-outline-primary btn-wave btn-agregar" (click)="abrirModalSecundario(cargaModalSwekPoint)"><span class="icon">+</span></button>
                    </div>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Tipo de Cambio</label>
                    <div class="combo-contenedor">
                        <ng-select placeholder="Seleccione una opción..." [items]="listTipoCambio" bindLabel="desTicker" bindValue="idTipoCambio" [(ngModel)]="this.objRegistroEditado.idTipoCambio"></ng-select>
                        <button class="btn btn-outline-primary btn-wave btn-agregar" (click)="abrirModalSecundario(cargaModalTipoCambio)"><span class="icon">+</span></button>
                    </div>
                </div>
            </div>
        </div>

        <div class="card-footer">
            <button type="submit" class="btn btn-primary" (click)="guardarCambios()">Guardar Cambios</button>
            <br>
        </div>
    </div>
</div>

<ng-template #cargaModalTermVolatility let-modal>
    <app-carga-term-volatilidad (close)="cerrarModalSecundario($event)"></app-carga-term-volatilidad>
</ng-template>

<ng-template #cargaModalSwekPoint let-modal>
    <app-carga-skew-point (close)="cerrarModalSecundario($event)"></app-carga-skew-point>
</ng-template>

<ng-template #cargaModalTipoCambio let-modal>
    <app-carga-tipo-cambio (close)="cerrarModalSecundario($event)"></app-carga-tipo-cambio>
</ng-template>
