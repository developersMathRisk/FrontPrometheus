<app-modal-formulario titulo="Editar Precio de Mercado" subtitulo="Modifique los datos y guarde los cambios." accion="Guardar Cambios"
    [faltantes]="faltantes" [datos]="objRegistroEditado" (cerrar)="cerrar()" (guardar)="guardarCambios()">

        <fieldset class="hig-seccion">
            <legend>Instrumento y fecha</legend>
            <div class="hig-cuadricula ">
                <div class="hig-campo">
                    <label class="form-label" for="pm-e-fecProceso">Fecha Proceso<span class="hig-requerido" aria-hidden="true">*</span></label>
                    <input id="pm-e-fecProceso" type="date" class="form-control" autocomplete="off" [(ngModel)]="this.objRegistroEditado.fecProceso" required>
                </div>
                <div class="hig-campo">
                    <label class="form-label" for="pm-e-idMoneda">Moneda<span class="hig-requerido" aria-hidden="true">*</span></label>
                    <div class="combo-contenedor">
                        <ng-select labelForId="pm-e-idMoneda" placeholder="Seleccione una opción…" [items]="listMoneda" bindLabel="desMoneda" bindValue="idMoneda" [(ngModel)]="this.objRegistroEditado.idMoneda" required></ng-select>
                        <button type="button" class="btn btn-outline-primary btn-wave btn-agregar" title="Agregar moneda" aria-label="Agregar moneda" (click)="abrirModalSecundario(cargaModalMoneda)"><span class="icon" aria-hidden="true">+</span></button>
                    </div>
                </div>
                <div class="hig-campo">
                    <label class="form-label" for="pm-e-nemonico">Nemónico<span class="hig-requerido" aria-hidden="true">*</span></label>
                    <input id="pm-e-nemonico" type="text" class="form-control" autocomplete="off" placeholder="Ej. AMZN" maxlength="60" [(ngModel)]="this.objRegistroEditado.nemonico" required>
                </div>
                <div class="hig-campo">
                    <label class="form-label" for="pm-e-codISIN">ISIN</label>
                    <input id="pm-e-codISIN" type="text" class="form-control" autocomplete="off" placeholder="Ej. US0231351067" maxlength="20" [(ngModel)]="this.objRegistroEditado.codISIN">
                </div>
            </div>
        </fieldset>

        <fieldset class="hig-seccion">
            <legend>Precio</legend>
            <div class="hig-cuadricula hig-columnas-3">
                <div class="hig-campo">
                    <label class="form-label" for="pm-e-numPrecioLimpio">Precio Limpio<span class="hig-requerido" aria-hidden="true">*</span></label>
                    <input id="pm-e-numPrecioLimpio" type="number" class="form-control" autocomplete="off" placeholder="0.00" step="any" inputmode="decimal" [(ngModel)]="this.objRegistroEditado.numPrecioLimpio" required>
                </div>
                <div class="hig-campo">
                    <label class="form-label" for="pm-e-numPrecioSucio">Precio Sucio</label>
                    <input id="pm-e-numPrecioSucio" type="number" class="form-control" autocomplete="off" step="any" inputmode="decimal" [(ngModel)]="this.objRegistroEditado.numPrecioSucio">
                </div>
                <div class="hig-campo">
                    <label class="form-label" for="pm-e-numInteresCorrido">Interés Corrido</label>
                    <input id="pm-e-numInteresCorrido" type="number" class="form-control" autocomplete="off" step="any" inputmode="decimal" [(ngModel)]="this.objRegistroEditado.numInteresCorrido">
                </div>
            </div>
        </fieldset>

        <details class="hig-detalles" [open]="objRegistroEditado.numPrecioSucio != null || objRegistroEditado.numInteresCorrido != null || objRegistroEditado.numTIR != null || objRegistroEditado.numDurMacaulay != null || objRegistroEditado.numDurModified != null || objRegistroEditado.numConvexidad != null || objRegistroEditado.numValorFacial != null || objRegistroEditado.numTasaCupon != null || !!objRegistroEditado.maturity">
            <summary>Datos de renta fija<span class="hig-detalles__nota">Opcional</span></summary>
            <p class="hig-seccion__ayuda">Solo aplican a bonos y otros instrumentos de deuda.</p>
            <div class="hig-cuadricula hig-columnas-3">
                <div class="hig-campo">
                    <label class="form-label" for="pm-e-numTIR">TIR</label>
                    <input id="pm-e-numTIR" type="number" class="form-control" autocomplete="off" step="any" inputmode="decimal" [(ngModel)]="this.objRegistroEditado.numTIR">
                </div>
                <div class="hig-campo">
                    <label class="form-label" for="pm-e-numDurMacaulay">Dur. Macaulay</label>
                    <input id="pm-e-numDurMacaulay" type="number" class="form-control" autocomplete="off" step="any" inputmode="decimal" [(ngModel)]="this.objRegistroEditado.numDurMacaulay">
                </div>
                <div class="hig-campo">
                    <label class="form-label" for="pm-e-numDurModified">Dur. Modificada</label>
                    <input id="pm-e-numDurModified" type="number" class="form-control" autocomplete="off" step="any" inputmode="decimal" [(ngModel)]="this.objRegistroEditado.numDurModified">
                </div>
                <div class="hig-campo">
                    <label class="form-label" for="pm-e-numConvexidad">Convexidad</label>
                    <input id="pm-e-numConvexidad" type="number" class="form-control" autocomplete="off" step="any" inputmode="decimal" [(ngModel)]="this.objRegistroEditado.numConvexidad">
                </div>
                <div class="hig-campo">
                    <label class="form-label" for="pm-e-numValorFacial">Valor Facial</label>
                    <input id="pm-e-numValorFacial" type="number" class="form-control" autocomplete="off" step="any" inputmode="decimal" [(ngModel)]="this.objRegistroEditado.numValorFacial">
                </div>
                <div class="hig-campo">
                    <label class="form-label" for="pm-e-numTasaCupon">Tasa Cupón (%)</label>
                    <input id="pm-e-numTasaCupon" type="number" class="form-control" autocomplete="off" step="any" inputmode="decimal" [(ngModel)]="this.objRegistroEditado.numTasaCupon">
                </div>
                <div class="hig-campo">
                    <label class="form-label" for="pm-e-maturity">Fecha Vencimiento</label>
                    <input id="pm-e-maturity" type="date" class="form-control" autocomplete="off" [(ngModel)]="this.objRegistroEditado.maturity">
                </div>
            </div>
        </details>

</app-modal-formulario>

<ng-template #cargaModalMoneda let-modal>
    <app-carga-moneda (close)="cerrarModalSecundario($event)"></app-carga-moneda>
</ng-template>
