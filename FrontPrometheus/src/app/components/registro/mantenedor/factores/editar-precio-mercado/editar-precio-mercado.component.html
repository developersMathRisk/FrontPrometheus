<div id="myModal" tabindex="-1" data-keyboard="false" role="dialog">
    <div role="document" class="msg_card_body" style="width: 100%;">
        <div class="modal-header">
            <table style="width: 100%;">
                <tr style="width: 100%;">
                    <td style="text-align: left; padding: 0% 0% 0.5% 1%;">
                        <h3 class="modal-title">Editar Precio de Mercado</h3>
                    </td>
                    <td style="text-align: right; padding-right: 1.3%;">
                        <button type="button" class="icon-close" (click)="cerrar()">
                            <mat-icon>close</mat-icon>
                        </button>
                    </td>
                </tr>
            </table>
        </div>
    </div>

    <div class="card">
        <!-- <div class="card-header justify-content-between d-sm-flex d-block">
            <div class="card-title">
                Datos Generales
            </div>
        </div> -->
        <div class="row">
            <div class="col-md-6">
                <label class="form-label">ISIN</label>
                <input type="text" placeholder="ISIN" minlength="1" maxlength="6" class="form-control" [(ngModel)]="this.objRegistroEditado.codISIN">
            </div>
            <div class="col-md-6">
                <label class="form-label">Nemónico</label>
                <input type="text" placeholder="Nemónico" minlength="1" maxlength="6" class="form-control" [(ngModel)]="this.objRegistroEditado.nemonico">
            </div>
        </div>
        <br>
        <div class="row">
            <div class="col-md-4">
                <label class="form-label">Moneda</label>
                <div class="combo-contenedor">
                    <ng-select placeholder="Seleccione una opción..." [items]="listMoneda" bindLabel="desMoneda" bindValue="idMoneda" [(ngModel)]="this.objRegistroEditado.codMoneda"></ng-select>
                    <button class="btn btn-outline-primary btn-wave btn-agregar" (click)="abrirModalSecundario(cargaModalMoneda)"><span class="icon">+</span></button>
                </div>
            </div>
        </div>
        <br>
        <div class="row">
            <div class="col-md-4">
                <label class="form-label">Precio Limpio</label>
                <input type="number" placeholder="Precio Limpio" minlength="1" maxlength="6" class="form-control" [(ngModel)]="this.objRegistroEditado.numPrecioLimpio">
            </div>
            <div class="col-md-4">
                <label class="form-label">Precio Sucio</label>
                <input type="number" placeholder="Precio Sucio" minlength="1" maxlength="6" class="form-control" [(ngModel)]="this.objRegistroEditado.numPrecioSucio">
            </div>
            <div class="col-md-4">
                <label class="form-label">Interés Corrido</label>
                <input type="number" placeholder="Interés Corrido" minlength="1" maxlength="6" class="form-control" [(ngModel)]="this.objRegistroEditado.numInteresCorrido">
            </div>
        </div>
        <br>
        <div class="row">
            <div class="col-md-4">
                <label class="form-label">TIR</label>
                <input type="number" placeholder="TIR" minlength="1" maxlength="6" class="form-control" [(ngModel)]="this.objRegistroEditado.numTIR">
            </div>
            <div class="col-md-4">
                <label class="form-label">Dur. Macaulay</label>
                <input type="number" placeholder="Dur. Macaulay" minlength="1" maxlength="6" class="form-control" [(ngModel)]="this.objRegistroEditado.numDurMacaulay">
            </div>
            <div class="col-md-4">
                <label class="form-label">Dur. Modificada</label>
                <input type="number" placeholder="Dur. Modificada" minlength="1" maxlength="6" class="form-control" [(ngModel)]="this.objRegistroEditado.numDurModified">
            </div>
        </div>
        <br>
        <div class="row">
            <div class="col-md-4">
                <label class="form-label">Convexidad</label>
                <input type="number" placeholder="Convexidad" minlength="1" maxlength="6" class="form-control" [(ngModel)]="this.objRegistroEditado.numConvexidad">
            </div>
            <div class="col-md-4">
                <label class="form-label">Valor Facial</label>
                <input type="number" placeholder="Valor Facial" minlength="1" maxlength="6" class="form-control" [(ngModel)]="this.objRegistroEditado.numValorFacial">
            </div>
            <div class="col-md-4">
                <label class="form-label">Tasa Cupón</label>
                <input type="number" placeholder="Tasa Cupón" minlength="1" maxlength="6" class="form-control" [(ngModel)]="this.objRegistroEditado.numTasaCupon">
            </div>
        </div>
        <br>
        <div class="row">
            <div class="col-md-6">
                <label class="form-label">Fecha Proceso</label>
                <input type="date" class="form-control" [(ngModel)]="this.objRegistroEditado.fecProceso">
            </div>

            <div class="col-md-6">
                <label class="form-label">Fecha Vencimiento</label>
                <input type="date" class="form-control" [(ngModel)]="this.objRegistroEditado.maturity">
            </div>
        </div>

        <div class="card-footer">
            <button type="submit" class="btn btn-primary" (click)="guardarCambios()">Guardar Cambios</button>
            <br>
        </div>
    </div>
</div>

<ng-template #cargaModalMoneda let-modal>
    <app-carga-moneda (close)="cerrarModalSecundario($event)"></app-carga-moneda>
</ng-template>
