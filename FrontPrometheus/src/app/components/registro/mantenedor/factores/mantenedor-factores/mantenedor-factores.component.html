<app-encabezado kicker="Mantenedores" titulo="Factores de Riesgo"
    subtitulo="Series de mercado que alimentan la valorización y el cálculo de VaR."></app-encabezado>

<div class="factores-segmentado" role="tablist" aria-label="Tipo de factor">
    <button *ngFor="let factor of factores; let i = index" #segmento type="button" role="tab"
        class="factores-segmento" [class.activo]="factor.id === factorSeleccionado"
        [id]="'factor-tab-' + factor.id" aria-controls="factor-panel"
        [attr.aria-selected]="factor.id === factorSeleccionado"
        [attr.tabindex]="factor.id === factorSeleccionado ? 0 : -1"
        (click)="seleccionar(factor.id)" (keydown)="alTeclear($event, i)">
        {{ factor.etiqueta }}
    </button>
</div>

<section id="factor-panel" class="card factores-panel" role="tabpanel"
    [attr.aria-labelledby]="'factor-tab-' + factorSeleccionado">
    <div class="card-body">
        <p class="factores-descripcion">{{ actual.descripcion }}</p>
        <ng-container *ngComponentOutlet="actual.componente"></ng-container>
    </div>
</section>
