<app-modal-formulario titulo="Cargar Tasa Interés" subtitulo="Registre un vértice de una curva de tasas de referencia." accion="Registrar"
    [faltantes]="faltantes" [datos]="nuevoRegistro" (cerrar)="cerrar()" (guardar)="registrar()">

        <fieldset class="hig-seccion">
            <legend>Vértice de la curva</legend>
            <div class="hig-cuadricula hig-columnas-3">
                <div class="hig-campo">
                    <label class="form-label" for="ti-c-codVertice">Cod. Vértice<span class="hig-requerido" aria-hidden="true">*</span></label>
                    <input id="ti-c-codVertice" type="text" class="form-control" autocomplete="off" maxlength="20" [(ngModel)]="this.nuevoRegistro.codVertice" required>
                </div>
                <div class="hig-campo">
                    <label class="form-label" for="ti-c-desVertice">Desc. Vértice</label>
                    <input id="ti-c-desVertice" type="text" class="form-control" autocomplete="off" maxlength="20" [(ngModel)]="this.nuevoRegistro.desVertice">
                </div>
                <div class="hig-campo">
                    <label class="form-label" for="ti-c-numPlazo">Plazo (días)<span class="hig-requerido" aria-hidden="true">*</span></label>
                    <input id="ti-c-numPlazo" type="number" class="form-control" autocomplete="off" step="any" inputmode="decimal" [(ngModel)]="this.nuevoRegistro.numPlazo" required>
                </div>
            </div>
        </fieldset>

        <fieldset class="hig-seccion">
            <legend>Curva y referencia</legend>
            <div class="hig-cuadricula ">
                <div class="hig-campo">
                    <label class="form-label" for="ti-c-codCurvaProveedor">Curva Proveedor<span class="hig-requerido" aria-hidden="true">*</span></label>
                    <input id="ti-c-codCurvaProveedor" type="text" class="form-control" autocomplete="off" maxlength="20" [(ngModel)]="this.nuevoRegistro.codCurvaProveedor" required>
                </div>
                <div class="hig-campo">
                    <label class="form-label" for="ti-c-codVerticeRef">Cod. Vértice Ref.</label>
                    <input id="ti-c-codVerticeRef" type="text" class="form-control" autocomplete="off" maxlength="20" [(ngModel)]="this.nuevoRegistro.codVerticeRef">
                    <p class="hig-campo__ayuda">Código externo del vértice, por ejemplo un ticker de Bloomberg.</p>
                </div>
            </div>
        </fieldset>

</app-modal-formulario>
