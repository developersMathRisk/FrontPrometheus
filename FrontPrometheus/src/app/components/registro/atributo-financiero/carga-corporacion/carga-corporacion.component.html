<div id="myModal" tabindex="-1" data-keyboard="false" role="dialog">
    <div role="document" class="msg_card_body" style="width: 100%;">
        <div class="modal-header">
            <table style="width: 100%;">
                <tr style="width: 100%;">
                    <td style="text-align: left; padding: 0% 0% 0.5% 1%;">
                        <h3 class="modal-title">Cargar Corporación</h3>
                    </td>
                    <td style="text-align: right; padding-right: 1.3%;">
                        <button type="button" class="icon-close" (click)="cerrar()">
                            <mat-icon>close</mat-icon>
                        </button>
                    </td>
                </tr>
            </table>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="row">
                <div class="col-md-4">
                    <label class="form-label">Descripción</label>
                    <input type="text" placeholder="Descripción" minlength="3" maxlength="20" class="form-control" [(ngModel)]="this.nuevoRegistro.descripcion">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Abreviatura</label>
                    <input type="text" placeholder="Abreviatura" minlength="3" maxlength="20" class="form-control" [(ngModel)]="this.nuevoRegistro.abrev">
                </div>
                <div class="col-md-4">
                    <label class="form-label">País</label>
                    <ng-select placeholder="Seleccione una opción..." [items]="listPais" bindLabel="desPais" bindValue="idPais" [(ngModel)]="this.nuevoRegistro.pais"></ng-select>
                </div>
            </div>

        </div>

        <div class="card-footer">
            <button type="submit" class="btn btn-primary" (click)="registrar()">Registrar</button>
            <br>
        </div>
    </div>
</div>
