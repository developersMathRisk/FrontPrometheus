<div id="myModal" tabindex="-1" data-keyboard="false" role="dialog">
    <div role="document" class="msg_card_body" style="width: 100%;">
        <div class="modal-header">
            <table style="width: 100%;">
                <tr style="width: 100%;">
                    <td style="text-align: left; padding: 0% 0% 0.5% 1%;">
                        <h3 class="modal-title">Editar Tipo Bono SBS</h3>
                    </td>
                    <td style="text-align: right; padding-right: 1.3%;">
                        <button type="button" class="icon-close" (click)="cerrar()">
                            <mat-icon>close</mat-icon>
                        </button>
                    </td>
                </tr>
            </table>
        </div>
    </div>

    <div class="card">
        <!-- <div class="card-header justify-content-between d-sm-flex d-block">
            <div class="card-title">
                Datos Generales
            </div>
        </div> -->
        <div class="card-body">
            <div class="row">
                <div class="col-md-4">
                    <label class="form-label">Código</label>
                    <input type="text" placeholder="Código" minlength="4" maxlength="4" class="form-control" [(ngModel)]="this.objRegistroEditado.codTipoBonoSBS">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Descripción</label>
                    <input type="text" placeholder="Descripción" minlength="3" maxlength="50" class="form-control" [(ngModel)]="this.objRegistroEditado.desTipoBonoSBS">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Tipo Bono Sucave</label>
                    <input type="text" placeholder="Tipo Bono Sucave" minlength="3" maxlength="10" class="form-control" [(ngModel)]="this.objRegistroEditado.codTipoBonoSucave">
                </div>
            </div>
        </div>

        <div class="card-footer">
            <button type="submit" class="btn btn-primary" (click)="guardarCambios()">Guardar Cambios</button>
            <br>
        </div>
    </div>
</div>
