<div>
    <button type="submit" class="btn btn-primary" (click)="registrar(cargaModal)">Agregar Moneda</button>
</div>

<br>

<div id="mat-sorting">
    <div class="mat-elevation-z8">
        <div class="table-responsive">
            <table mat-table [dataSource]="dataSource" matSort #sort="matSort">

                <ng-container matColumnDef="codMoneda">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
                    <td mat-cell *matCellDef="let element"> {{element.codMoneda}} </td>
                </ng-container>

                <ng-container matColumnDef="codPais">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>País</th>
                    <td mat-cell *matCellDef="let element"> {{element.codPais}} </td>
                </ng-container>

                <ng-container matColumnDef="descripcion">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Descripción</th>
                    <td mat-cell *matCellDef="let element"> {{element.descripcion}} </td>
                </ng-container>

                <ng-container matColumnDef="simbolo">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Símbolo</th>
                    <td mat-cell *matCellDef="let element"> {{element.simbolo}} </td>
                </ng-container>

                <ng-container matColumnDef="codSucave">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Sucave</th>
                    <td mat-cell *matCellDef="let element"> {{element.codSucave}} </td>
                </ng-container>

                <ng-container matColumnDef="relacionUsd">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Relación USD</th>
                    <td mat-cell *matCellDef="let element"> {{element.relacionUsd}} </td>
                </ng-container>

                <ng-container matColumnDef="corporacion">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Corporación</th>
                    <td mat-cell *matCellDef="let element"> {{element.corporacion}} </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;" (contextmenu)="onContextMenu($event, row)"></tr>
            </table>
        </div>
        <mat-paginator #paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons>
        </mat-paginator>
    </div>

</div>

<div style="visibility: hidden; position: fixed"
    [style.left]="contextMenuPosition.x"
    [style.top]="contextMenuPosition.y"
    [matMenuTriggerFor]="contextMenu">
</div>

<mat-menu #contextMenu="matMenu">
    <ng-template matMenuContent let-item="item">
        <button mat-menu-item (click)="editar(selectedRow, editarModal)">
            <mat-icon>edit</mat-icon> Editar
        </button>
        <button mat-menu-item (click)="eliminar(selectedRow)">
            <mat-icon>delete</mat-icon> Eliminar
        </button>
    </ng-template>
</mat-menu>

<ng-template #cargaModal let-modal>
    <app-carga-moneda (close)="cerrarModal($event)"></app-carga-moneda>
</ng-template>

<ng-template #editarModal let-modal>
    <app-editar-moneda (close)="cerrarModal($event)" [data]="filaEditar"></app-editar-moneda>
</ng-template>
