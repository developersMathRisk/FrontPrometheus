<form novalidate="" class="row g-3 mt-0 ng-untouched ng-pristine ng-valid">
    <div class="card">
        <div class="card-header justify-content-between d-sm-flex d-block">
            <div class="card-title d-flex align-items-center">
                <label for="select-producto">Mantenedor de </label>
                <ng-select style="margin-left: 10px; width: 250px;" placeholder="Seleccione un producto.." name="select-producto" [items]="listaProductos" bindLabel="descripcion" bindValue="id" [(ngModel)]="this.productoSeleccionado"></ng-select>                
            </div>
        </div>
        <div class="card-body">
            <ng-container *ngIf="componenteSeleccionado">
                <ng-container *ngComponentOutlet="componenteSeleccionado"></ng-container>
            </ng-container>
            <!-- <div *ngIf="productoSeleccionado === 1">
                <app-lista-accion></app-lista-accion>
            </div>
            <div *ngIf="productoSeleccionado === 2">
                <app-lista-bono></app-lista-bono>
            </div>
            <div *ngIf="productoSeleccionado === 3">
                <app-lista-fondo-inversion></app-lista-fondo-inversion>
            </div> -->
        </div>
    </div>
</form>
