<div id="myModal" tabindex="-1" data-keyboard="false" role="dialog">
    <div role="document" class="msg_card_body" style="width: 100%;">
        <div class="modal-header">
            <table style="width: 100%;">
                <tr style="width: 100%;">
                    <td style="text-align: left; padding: 0% 0% 0.5% 1%;">
                        <h3 class="modal-title">Cargar Bono</h3>
                    </td>
                    <td style="text-align: right; padding-right: 1.3%;">
                        <button type="button" class="icon-close" (click)="cerrar()">
                            <mat-icon>close</mat-icon>
                        </button>
                    </td>
                </tr>
            </table>
        </div>
    </div>

    <div class="card">
        <!-- <div class="card-header justify-content-between d-sm-flex d-block">
            <div class="card-title">
                Datos Generales
            </div>
        </div> -->
        <div class="card-body">
            <div class="row">
                <div class="col-md-3">
                    <label class="form-label">Código ISIN</label>
                    <input type="text" placeholder="Código ISIN" minlength="3" maxlength="20" class="form-control" [(ngModel)]="this.nuevoRegistro.codISIN">
                </div>

                <div class="col-md-3">
                    <label class="form-label">Nemónico</label>
                    <input type="text" placeholder="Nemónico" minlength="3" maxlength="60" class="form-control" [(ngModel)]="this.nuevoRegistro.desNemonico">
                </div>

                <div class="col-md-3">
                    <label class="form-label">Método Amortización</label>
                    <input type="text" placeholder="Método Amortización" minlength="3" maxlength="4" class="form-control" [(ngModel)]="this.nuevoRegistro.codMetoAmortizac">
                </div>

                <div class="col-md-3">
                    <label class="form-label">Frecuencia Pago</label>
                    <input type="text" placeholder="Frecuencia Pago" minlength="1" maxlength="1" class="form-control" [(ngModel)]="this.nuevoRegistro.codFrecuenciaPago">
                </div>
            </div>

            <br>
            
            <div class="row">
                <div class="col-md-3">
                    <label class="form-label">Fórmula Tasa</label>
                    <input type="text" placeholder="Fórmula Tasa" minlength="1" maxlength="1" class="form-control" [(ngModel)]="this.nuevoRegistro.codFormulaTasa">
                </div>

                <div class="col-md-3">
                    <label class="form-label">Base Cálculo Ic</label>
                    <input type="text" placeholder="Base Cálculo Ic" minlength="3" maxlength="12" class="form-control" [(ngModel)]="this.nuevoRegistro.codBaseCalculoIc">
                </div>

                <div class="col-md-3">
                    <label class="form-label">Base Cálculo Dcto.</label>
                    <input type="text" placeholder="Base Cálculo Dcto." minlength="3" maxlength="12" class="form-control" [(ngModel)]="this.nuevoRegistro.codBaseCalculoDcto">
                </div>

                <div class="col-md-3">
                    <label class="form-label">Tipo Tasa</label>
                    <input type="text" placeholder="Tipo Tasa" minlength="1" maxlength="1" class="form-control" [(ngModel)]="this.nuevoRegistro.codTipoTasa">
                </div>
            </div>

            <br>

            <div class="row">
                <div class="col-md-3">
                    <label class="form-label">Tasa RJTE</label>
                    <input type="text" placeholder="Tasa RJTE" minlength="1" maxlength="4" class="form-control" [(ngModel)]="this.nuevoRegistro.codTasaRjte">
                </div>

                <div class="col-md-3">
                    <label class="form-label">Curva Referencia</label>
                    <input type="text" placeholder="Curva Referencia" minlength="3" maxlength="15" class="form-control" [(ngModel)]="this.nuevoRegistro.codCurvaReferencia">
                </div>

                <div class="col-md-3">
                    <label class="form-label">Tipo Bono CVG</label>
                    <input type="text" placeholder="Tipo Bono CVG" minlength="3" maxlength="6" class="form-control" [(ngModel)]="this.nuevoRegistro.codTipoBonoCVG">
                </div>

                <div class="col-md-3">
                    <label class="form-label">Base Cálculo Flujo</label>
                    <input type="text" placeholder="Base Cálculo Flujo" minlength="3" maxlength="12" class="form-control" [(ngModel)]="this.nuevoRegistro.codBaseCalculoFlujo">
                </div>
            </div>

            <br>

            <div class="row">
                <div class="col-md-3">
                    <label class="form-label">ISIN Sob. Gdn.</label>
                    <input type="text" placeholder="ISIN Sob. Gdn." minlength="3" maxlength="20" class="form-control" [(ngModel)]="this.nuevoRegistro.codISINSOBGDN">
                </div>

                <div class="col-md-3">
                    <label class="form-label">Reset Index</label>
                    <input type="text" placeholder="Reset Index" minlength="3" maxlength="30" class="form-control" [(ngModel)]="this.nuevoRegistro.desResetIndex">
                </div>
            </div>

            <br>

            <div class="row">
                <div class="col-md-3">
                    <label class="form-label">Tasa Cupón</label>
                    <input type="number" placeholder="Tasa Cupón" class="form-control" [(ngModel)]="this.nuevoRegistro.numTasaCupon">
                </div>

                <div class="col-md-3">
                    <label class="form-label">Spread Tasa Variable</label>
                    <input type="number" placeholder="Nemónico" class="form-control" [(ngModel)]="this.nuevoRegistro.numSpreadTasaVar">
                </div>

                <div class="col-md-3">
                    <label class="form-label">Spread Liquidez</label>
                    <input type="number" placeholder="Spread Liquidez" class="form-control" [(ngModel)]="this.nuevoRegistro.mtoSpreadLiquidez">
                </div>

                <div class="col-md-3">
                    <label class="form-label">Spread Emisión</label>
                    <input type="number" placeholder="Spread Emisión" class="form-control" [(ngModel)]="this.nuevoRegistro.mtoSpreadEmision">
                </div>
            </div>

            <br>

            <div class="row">
                <div class="col-md-3">
                    <label class="form-label">Fecha Inicio</label>
                    <input type="date" class="form-control" [(ngModel)]="this.nuevoRegistro.fecInicio">
                </div>

                <div class="col-md-3">
                    <label class="form-label">Fecha Vencimiento</label>
                    <input type="date" class="form-control" [(ngModel)]="this.nuevoRegistro.fecVcto">
                </div>
            </div>

            <br>

            <div class="row">
                <div class="col-md-4">
                    <label class="form-label">Emisor</label>
                    <ng-select placeholder="Seleccione una opción..." [items]="listEmisor" bindLabel="nomEmisor" bindValue="idEmisor" [(ngModel)]="this.nuevoRegistro.idEmisor"></ng-select>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Moneda</label>
                    <ng-select placeholder="Seleccione una opción..." [items]="listMoneda" bindLabel="desMoneda" bindValue="idMoneda" [(ngModel)]="this.nuevoRegistro.idMoneda"></ng-select>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Tipo Bono SBS</label>
                    <ng-select placeholder="Seleccione una opción..." [items]="listTipoBonoSBS" bindLabel="desTipoBonoSBS" bindValue="idTipoBonoSBS" [(ngModel)]="this.nuevoRegistro.idTipoBonoSBS"></ng-select>
                </div>
            </div>

            <br>

            <div class="row">
                <div class="col-md-2">
                    <div class="form-check"><input type="checkbox" class="form-check-input" id="chkRevisado" name="chkRevisado" [(ngModel)]="this.nuevoRegistro.flgRevisado"><label for="chkRevisado" class="form-check-label"> Revisado </label></div>
                </div>

                <div class="col-md-2">
                    <div class="form-check"><input type="checkbox" class="form-check-input" id="chkProrrateo" name="chkProrrateo" [(ngModel)]="this.nuevoRegistro.flgProrrateo"><label for="chkProrrateo" class="form-check-label"> Prorrateo </label></div>
                </div>

                <div class="col-md-2">
                    <div class="form-check"><input type="checkbox" class="form-check-input" id="chkValCirc" name="chkValCirc" [(ngModel)]="this.nuevoRegistro.flgValCirc"><label for="chkValCirc" class="form-check-label"> Val. Circ. </label></div>
                </div>

                <div class="col-md-2">
                    <div class="form-check"><input type="checkbox" class="form-check-input" id="chkTipoPago" name="chkTipoPago" [(ngModel)]="this.nuevoRegistro.flgTipoPago"><label for="chkTipoPago" class="form-check-label"> Tipo Pago </label></div>
                </div>

                <div class="col-md-2">
                    <div class="form-check"><input type="checkbox" class="form-check-input" id="chkFicticio" name="chkFicticio" [(ngModel)]="this.nuevoRegistro.flgFicticio"><label for="chkFicticio" class="form-check-label"> Ficticio </label></div>
                </div>

                <div class="col-md-2">
                    <div class="form-check"><input type="checkbox" class="form-check-input" id="chkOpcionCall" name="chkOpcionCall" [(ngModel)]="this.nuevoRegistro.flgOpcionCall"><label for="chkOpcionCall" class="form-check-label"> Opción Call </label></div>
                </div>
            </div>

        </div>

        <div class="card-footer">
            <button type="submit" class="btn btn-primary" (click)="registrar()">Registrar</button>
            <br>
        </div>
    </div>
</div>
