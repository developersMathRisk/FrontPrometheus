<div class="page page-style1 page-style2 error-page">
    <div class="d-md-flex"> 
        <div class="w-40p bg-style h-100vh page-style">
            <div class="page-content">
                <div class="page-single-content">
                    <img [routerLink]="['/dashboards/sales']" src="./assets/images/brand-logos/desktop-white.png" alt="img" class="header-brand-img mb-4">
                    <div class="card-body text-white py-5 px-5">
                        <img src="./assets/images/png/1.png" alt="img" class="w-100 mx-auto text-center">
                    </div>
                </div>
            </div>
        </div>
        <div class="w-80p page-content">
            <div class="page-single-content">
                <div class="card-body p-3 p-sm-5">
                    <div class="row g-0">
                        <div class="col-lg-8 col-sm-12 center-block align-items-center construction">
                            <div class="construction-body text-center">
                                <div class="card-body ">
                                    <h2 class="display-5 mb-2 fw-bold"><strong>Under Construction</strong></h2>
                                    <h4>Our website is in Under construction</h4>
                                    <br>
                                    <div class="row mt-4 gx-0 gx-sm-2 gy-xxl-0 gy-3 mb-5 justify-content-center"> 
                                        <div class="col-lg-6"> 
                                            <div class="row g-0 g-sm-4 justify-content-center" id="timer">
                                                <div class="col-xxl-3 col-xl-6 col-lg-6 col-md-3 col-sm-6 col-12">
                                                    <div class="under-maintenance-time rounded">
                                                        <h2 class="fw-semibold mb-0 text-fixed-white">{{days}}</h2>
                                                        <p class="mb-1 fs-12 op-6">DAYS</p>
                                                    </div>
                                                </div>
                                                <div class="col-xxl-3 col-xl-6 col-lg-6 col-md-3 col-sm-6 col-12">
                                                    <div class="under-maintenance-time rounded">
                                                        <h2 class="fw-semibold mb-0 text-fixed-white">{{hours}}</h2>
                                                        <p class="mb-1 fs-12 op-6">HOURS</p>
                                                    </div>
                                                </div>
                                                <div class="col-xxl-3 col-xl-6 col-lg-6 col-md-3 col-sm-6 col-12">
                                                    <div class="under-maintenance-time rounded">
                                                        <h2 class="fw-semibold mb-0 text-fixed-white">{{minutes}}</h2>
                                                        <p class="mb-1 fs-12 op-6">MINUTES</p>
                                                    </div>
                                                </div>
                                                <div class="col-xxl-3 col-xl-6 col-lg-6 col-md-3 col-sm-6 col-12">
                                                    <div class="under-maintenance-time rounded">
                                                        <h2 class="fw-semibold mb-0 text-fixed-white">{{seconds}}</h2>
                                                      <p class="mb-1 fs-12 op-6">SECONDS</p>
                                                    </div>
                                                </div>
                                         </div>
                                    </div>
                                  </div>
                                </div>
                                <div class="row g-0">
                                    <div class="col-sm-6 d-block mx-auto">
                                        <div class="input-group mb-4">
                                            <span class="input-group-addon bg-white"><svg class="svg-icon" xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 0 24 24" width="24"><path d="M0 0h24v24H0V0z" fill="none"></path><path d="M20 8l-8 5-8-5v10h16zm0-2H4l8 4.99z" opacity=".3"></path><path d="M4 20h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2zM20 6l-8 4.99L4 6h16zM4 8l8 5 8-5v10H4V8z"></path></svg></span>
                                            <input type="text" class="form-control" placeholder="Enter Your Email">
                                            <a aria-label="anchor" href="javascript:void(0)" class="input-group-text bg-white p-2 btn"><svg class="svg-icon" xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 0 24 24" width="24"><path d="M0 0h24v24H0V0z" fill="none"></path><path d="M4 8.25l7.51 1-7.5-3.22zm.01 9.72l7.5-3.22-7.51 1z" opacity=".3"></path><path d="M2.01 3L2 10l15 2-15 2 .01 7L23 12 2.01 3zM4 8.25V6.03l7.51 3.22-7.51-1zm.01 9.72v-2.22l7.51-1-7.51 3.22z"></path></svg></a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
