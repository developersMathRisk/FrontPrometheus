  
   <app-page-header hassub="" sub="Pages" title1="Ecommerce" title="Wishlist" activeTitle="Wishlist" ></app-page-header>
   <!-- Start:: row-1 -->
  <div class="row">
    <div class="col-xl-12">
        <div class="row">
            @for (data of products; track $index) {

                <div class="col-xl-3 col-lg-6 col-sm-6">
                    <div class="card item-card product-card">
                        <div class="card-body ">
                            <div class="text-center pb-4">
                                <img [src]="data.src" alt="img" class="img-fluid w-100 product-img br-7">
                            </div>
                            <div class="d-flex justify-content-between align-items-center">
                                <div class="cardtitle">
                                    <div>
                                        <a aria-label="anchor" href="javascript:void(0)"><i class="fa fa-star text-warning fs-16"></i></a>
                                        <a aria-label="anchor" href="javascript:void(0)"><i class="fa fa-star text-warning fs-16"></i></a>
                                        <a aria-label="anchor" href="javascript:void(0)"><i class="fa fa-star text-warning fs-16"></i></a>
                                        <a aria-label="anchor" href="javascript:void(0)"><i class="fa fa-star-half-o text-warning fs-16"></i></a>
                                        <a aria-label="anchor" href="javascript:void(0)"><i class="fa fa-star-o text-warning fs-16"></i></a>
                                        <a href="javascript:void(0)"> ({{data.rating}})</a>
                                    </div>
                                    <a class="shop-title">{{data.name}}</a>
                                </div>
                                <div class="cardprice">
                                    <span class="type--strikethrough">{{data.offerprice}}</span>
                                    <span>{{data.price}}</span>
                                </div>
                            </div>
                        </div>
                        <div class="text-center card-footer">
                            <div class="btn-list">
                                <a [routerLink]="['/pages/ecommerce/cart']" class="btn btn-primary btn-svgs">
                                    <svg class="svg-icon" xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 0 24 24" width="24"><path d="M0 0h24v24H0V0z" fill="none"></path><path d="M15.55 11l2.76-5H6.16l2.37 5z" opacity=".3"></path><path d="M15.55 13c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.37-.66-.11-1.48-.87-1.48H5.21l-.94-2H1v2h2l3.6 7.59-1.35 2.44C4.52 15.37 5.48 17 7 17h12v-2H7l1.1-2h7.45zM6.16 6h12.15l-2.76 5H8.53L6.16 6zM7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zm10 0c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"></path></svg>
                                    <span>Add to cart</span>
                                </a>
                                <a (click)="ConformAlert(data.id)" href="javascript:void(0)" class="btn btn-light btn-svgs btn-delete">
                                    <svg class="svg-icon" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 0 24 24" width="24px" fill="#000000"><path d="M0 0h24v24H0V0z" fill="none"></path><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"></path></svg>
                                    <span>Remove</span>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            }
        </div> 
        <div class="d-flex justify-content-end">
            <ul class="pagination ">
                <li class="page-item page-prev disabled">
                    <a class="page-link" href="javascript:void(0)" tabindex="-1">Prev</a>
                </li>
                <li class="page-item active"><a class="page-link" href="javascript:void(0)">1</a></li>
                <li class="page-item"><a class="page-link" href="javascript:void(0)">2</a></li>
                <li class="page-item"><a class="page-link" href="javascript:void(0)">3</a></li>
                <li class="page-item"><a class="page-link" href="javascript:void(0)">4</a></li>
                <li class="page-item page-next">
                    <a class="page-link" href="javascript:void(0)">Next</a>
                </li>
            </ul>
        </div>
    </div>
</div>
<!-- End:: row-1 -->
