
<app-page-header hassub="" sub="Pages" title1="Profile" title="Edit Profile" activeTitle="Edit Profile" ></app-page-header>
<!-- Start:: row-1 -->
<div class="row">
    <div class="col-xl-4 col-lg-5">
        <div class="card">
            <div class="card-header">
                <div class="card-title">Edit Password</div>
            </div>
            <div class="card-body">
                <div class="text-center mb-4">
                    <img alt="User Avatar" class="rounded-circle" src="./assets/images/faces/16.jpg">
                    <div class="mt-4 ms-0 ms-sm-auto ">
                        <a [routerLink]="['/pages/profile/profile-1']"class="btn-sm btn btn-primary mb-1 me-1">View profile</a>
                        <a href="javascript:void(0)" class="btn-sm btn btn-danger mb-1 me-1">Delete profile</a>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Change Password</label>
                    <input type="password" class="form-control" value="password">
                </div>
                <div class="mb-3">
                    <label class="form-label">New Password</label>
                    <input type="password" class="form-control" value="password">
                </div>
                <div class="mb-3">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" value="password">
                </div>
            </div>
            <div class="card-footer text-end">
                <a href="javascript:void(0)" class="btn btn-primary me-1">Updated</a>
                <a href="javascript:void(0)" class="btn btn-danger me-1">Cancel</a>
            </div>
        </div>
    </div>
    <div class="col-xl-8 col-lg-7">
        <div class="card">
            <div class="card-header">
                <div class="card-title">Edit Profile</div>
            </div>
            <div class="card-body">
                <div class="card-title fw-bold">Basic info:</div>
                <div class="row">
                    <div class="col-sm-6 col-md-6">
                        <div class="mb-3">
                            <label class="form-label">First Name</label>
                            <input type="text" class="form-control" placeholder="First Name">
                        </div>
                    </div>
                    <div class="col-sm-6 col-md-6">
                        <div class="mb-3">
                            <label class="form-label">Last Name</label>
                            <input type="text" class="form-control" placeholder="Last Name">
                        </div>
                    </div>
                    <div class="col-sm-6 col-md-6">
                        <div class="mb-3">
                            <label class="form-label">Email address</label>
                            <input type="email" class="form-control" placeholder="Email">
                        </div>
                    </div>
                    <div class="col-sm-6 col-md-6">
                        <div class="mb-3">
                            <label class="form-label">Phone Number</label>
                            <input type="number" class="form-control" placeholder="Number">
                        </div>
                    </div>
                    <div class="col-md-12">
                        <div class="mb-3">
                            <label class="form-label">Address</label>
                            <input type="text" class="form-control" placeholder="Home Address">
                        </div>
                    </div>
                    <div class="col-sm-6 col-md-4">
                        <div class="mb-3">
                            <label class="form-label">City</label>
                            <input type="text" class="form-control" placeholder="City">
                        </div>
                    </div>
                    <div class="col-sm-6 col-md-3">
                        <div class="mb-3">
                            <label class="form-label">Postal Code</label>
                            <input type="number" class="form-control" placeholder="ZIP Code">
                        </div>
                    </div>
                    <div class="col-md-5">
                        <div class="mb-3 countery-select">
                            <label class="form-label">Country</label>
                            <ng-select placeholder="--Select--" data-trigger>
                                        <ng-option>--Select--</ng-option>
                                        <ng-option value="1">Germany</ng-option>
                                        <ng-option value="2">Real Estate</ng-option>
                                        <ng-option value="3">Canada</ng-option>
                                        <ng-option value="4">Usa</ng-option>
                                        <ng-option value="5">Afghanistan</ng-option>
                                        <ng-option value="6">Albania</ng-option>
                                        <ng-option value="7">China</ng-option>
                                        <ng-option value="8">Denmark</ng-option>
                                        <ng-option value="9">Finland</ng-option>
                                        <ng-option value="10">India</ng-option>
                                        <ng-option value="11">Kiribati</ng-option>
                                        <ng-option value="12">Kuwait</ng-option>
                                        <ng-option value="13">Mexico</ng-option>
                                        <ng-option value="14">Pakistan</ng-option>
                                   
                                </ng-select>
                        </div>
                    </div>
                </div>
                <div class="card-title fw-bold mt-4">External Links:</div>
                <div class="row">
                    <div class="col-sm-6 col-md-6">
                        <div class="mb-3">
                            <label class="form-label">Facebook</label>
                            <input type="text" class="form-control" placeholder="https://www.facebook.com/">
                        </div>
                    </div>
                    <div class="col-sm-6 col-md-6">
                        <div class="mb-3">
                            <label class="form-label">Google</label>
                            <input type="text" class="form-control" placeholder="https://www.google.com/">
                        </div>
                    </div>
                    <div class="col-sm-6 col-md-6">
                        <div class="mb-3">
                            <label class="form-label">Twitter</label>
                            <input type="text" class="form-control" placeholder="https://twitter.com/">
                        </div>
                    </div>
                    <div class="col-sm-6 col-md-6">
                        <div class="mb-3">
                            <label class="form-label">Pinterest</label>
                            <input type="text" class="form-control" placeholder="https://in.pinterest.com/">
                        </div>
                    </div>
                </div>
                <div class="card-title fw-bold mt-4">About:</div>
                <div class="row">
                    <div class="col-md-12">
                        <div class="mb-3">
                            <label class="form-label">About Me</label>
                            <textarea rows="5" class="form-control" placeholder="Enter About your description"></textarea>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card-footer text-end">
                <div class="btn-list">
                    <a href="javascript:void(0)" class="btn btn-primary">Updated</a>
                    <a href="javascript:void(0)" class="btn btn-danger">Cancel</a>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- End:: row-1 -->
