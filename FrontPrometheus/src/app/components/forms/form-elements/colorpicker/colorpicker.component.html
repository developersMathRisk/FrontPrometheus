<app-page-header hassub="" sub="Forms" title1="Form Elements" title="Color Pickers" activeTitle="Color Pickers"></app-page-header>

 <!-- Start::row-1 -->
 <div class="row">
    <div class="co1">
        <div class="card">
            <div class="card-header justify-content-between d-sm-flex d-block">
                <div class="card-title">
                    Bootstrap Color Picker
                </div>
                <div class="prism-toggle mt-2 mt-sm-0">
                    <button type="button" class="btn btn-sm btn-primary-light" appShowCode>Show Code<i class="ri-code-line ms-2 d-inline-block align-middle"></i></button>
                </div>
            </div>
            <div class="card-body">
                <input type="color" class="form-control form-control-color border-0"
                        id="exampleColorInput" value="#136ad0" title="Choose your color">
            </div>
            <div class="card-footer d-none border-top-0">
<!-- Prism Code -->
<pre class="language-html"><code class="language-html">&lt;input type="color" class="form-control form-control-color border-0"
id="exampleColorInput" value="#136ad0" title="Choose your color"&gt;</code></pre>
<!-- Prism Code -->
            </div>
        </div>
    </div>
    <div class="col">
        <div class="card">
            <div class="card-header">
                <div class="card-title">
                    Classic
                </div>
            </div>
            <div class="card-body d-flex justify-content-between">
                <div>
                    <div class="theme-container"></div>
                    <div class="pickr-container example-picker">
                        <input [value]="color" [style.background]="color" [cpCancelButton]="true"
                        [cpCancelButtonClass]="'btn btn-primary btn-xs'" [cpEyeDropper]="true"
                        [(colorPicker)]="color" [cpOKButton]="true" [cpSaveClickOutside]="false"
                        [cpOKButtonClass]="'btn btn-primary btn-xs'" class="text-white" />
                    </div>
                </div>
                <div>
                    <div class="theme-container1"></div>
                    <div class="pickr-container1 example-picker">
                        <ngx-colors ngx-colors-trigger [(ngModel)]="color3" acceptLabel="Select" cancelLabel="Cancel">
                        </ngx-colors>
                    </div>
                </div>
                <div>
                    <div class="theme-container2"></div>
                    <div class="pickr-container2 example-picker mt-1">
                        <div class="example-palette-button" ngx-colors-trigger [(ngModel)]="input1"
                            [style.color]="input1">
                            <mat-icon aria-hidden="false" aria-label="Example home icon" fontIcon="palette">
                            </mat-icon>
                        </div> 
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<!--End::row-1 -->
