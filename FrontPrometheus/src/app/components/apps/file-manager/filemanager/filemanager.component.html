 
 <app-page-header hassub="apps" sub="" title1="File Manager" title="File Manager" activeTitle="File Manager"></app-page-header><!-- Row -->
 <div class="row">
    <div class="col-lg-4 col-xl-3">
        <div class="card filemanager-list">
            <div class="card-body d-flex align-items-center p-0">
                <div class="chart-wrapper">
                    <div id="filemanager">
                        <apx-chart
                        [series]="chartOptions.series!"
                        [chart]="chartOptions.chart!"
                        [plotOptions]="chartOptions.plotOptions!"
                        [stroke]="chartOptions.stroke!"
                        [colors]="chartOptions.colors!"
                        [fill]="chartOptions.fill!"
                      ></apx-chart>
                    </div>
                </div>
                <div class="my-auto">
                    <h5 class="mb-1 fw-bold">Storage</h5>
                    <p class="mb-0"><span class="text-muted">13.65gb</span> / <span class="text-muted">16gb</span></p>
                </div>
            </div>
            <div class="card-body px-0 py-3">
                <div class="list-group list-group-transparent mb-0 file-manger px-0">
                    <a href="javascript:void(0);" class="list-group-item list-group-item-action d-flex align-items-center py-2">
                        <svg class="svg-icon me-2" xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 0 24 24" width="24"><path d="M0 0h24v24H0V0z" fill="none"/><path d="M5 19h14V5H5v14zm4-5.86l2.14 2.58 3-3.87L18 17H6l3-3.86z" opacity=".3"/><path d="M3 5v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2zm16 14H5V5h14v14zm-4.86-7.14l-3 3.86L9 13.14 6 17h12z"/></svg>Images
                    </a>
                    <a href="javascript:void(0);" class="list-group-item list-group-item-action d-flex align-items-center py-2">
                        <svg class="svg-icon me-2" xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 0 24 24" width="24"><path d="M0 0h24v24H0V0z" fill="none"/><path d="M5 8h10v8H5z" opacity=".3"/><path d="M17 7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4V7zm-2 9H5V8h10v8z"/></svg> Videos
                    </a>
                    <a href="javascript:void(0);" class="list-group-item list-group-item-action d-flex align-items-center py-2">
                        <svg class="svg-icon me-2" xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 0 24 24" width="24"><path d="M0 0h24v24H0V0z" fill="none"/><path d="M13 4H6v16h12V9h-5V4zm3 14H8v-2h8v2zm0-6v2H8v-2h8z" opacity=".3"/><path d="M8 16h8v2H8zm0-4h8v2H8zm6-10H6c-1.1 0-2 .9-2 2v16c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm4 18H6V4h7v5h5v11z"/></svg>Docs
                    </a>
                    <a href="javascript:void(0);" class="list-group-item list-group-item-action d-flex align-items-center py-2">
                        <svg class="svg-icon me-2" xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 0 24 24" width="24"><path d="M0 0h24v24H0V0z" fill="none"/><path d="M3 19h18V5H3v14zm8-7c.35 0 .69.07 1 .18V6h5v2h-3v7.03c-.02 1.64-1.35 2.97-3 2.97-1.66 0-3-1.34-3-3s1.34-3 3-3z" opacity=".3"/><path d="M21 3H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H3V5h18v14zm-10-1c1.65 0 2.98-1.33 3-2.97V8h3V6h-5v6.18c-.31-.11-.65-.18-1-.18-1.66 0-3 1.34-3 3s1.34 3 3 3z"/></svg> Music
                    </a>
                    <a href="javascript:void(0);" class="list-group-item list-group-item-action d-flex align-items-center py-2">
                        <svg class="svg-icon me-2" xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 0 24 24" width="24"><path d="M0 0h24v24H0V0z" fill="none"/><path d="M4 4h10v16H4z" opacity=".3"/><path d="M14 1H4c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-2-2-2zm0 19H4V4h10v16zm6.1-12.3l-1 1c1.8 1.8 1.8 4.6 0 6.5l1 1c2.5-2.3 2.5-6.1 0-8.5zM17 10.8c.5.7.5 1.6 0 2.3l1 1c1.2-1.2 1.2-3 0-4.3l-1 1z"/></svg>APKs
                    </a>
                    <a href="javascript:void(0);" class="list-group-item list-group-item-action d-flex align-items-center py-2">
                        <svg class="svg-icon me-2" xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 0 24 24" width="24"><path d="M0 0h24v24H0V0z" fill="none"/><path d="M14.17 11H13V5h-2v6H9.83L12 13.17z" opacity=".3"/><path d="M19 9h-4V3H9v6H5l7 7 7-7zm-8 2V5h2v6h1.17L12 13.17 9.83 11H11zm-6 7h14v2H5z"/></svg>Downloads
                    </a>
                    <a href="javascript:void(0);" class="list-group-item list-group-item-action d-flex align-items-center py-2">
                        <svg class="svg-icon me-2" xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 0 24 24" width="24"><path d="M0 0h24v24H0V0z" fill="none"/><path d="M5 5h4v4H5zm10 10h4v4h-4zM5 15h4v4H5zM16.66 4.52l-2.83 2.82 2.83 2.83 2.83-2.83z" opacity=".3"/><path d="M16.66 1.69L11 7.34 16.66 13l5.66-5.66-5.66-5.65zm-2.83 5.65l2.83-2.83 2.83 2.83-2.83 2.83-2.83-2.83zM3 3v8h8V3H3zm6 6H5V5h4v4zM3 21h8v-8H3v8zm2-6h4v4H5v-4zm8-2v8h8v-8h-8zm6 6h-4v-4h4v4z"/></svg> More
                    </a>
                    <a href="javascript:void(0);" class="list-group-item list-group-item-action d-flex align-items-center py-2">
                        <svg class="svg-icon me-2" xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 0 24 24" width="24"><path d="M0 0h24v24H0V0zm0 0h24v24H0V0z" fill="none"/><path d="M6 20h12V10H6v10zm2-6h3v-3h2v3h3v2h-3v3h-2v-3H8v-2z" opacity=".3"/><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM8.9 6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2H8.9V6zM18 20H6V10h12v10zm-7-1h2v-3h3v-2h-3v-3h-2v3H8v2h3z"/></svg> Hidden Files
                    </a>
                </div>
            </div>
            <div class="card-body border-top py-3">
                <div class="list-group list-group-transparent mb-0 mail-inbox">
                    <a href="javascript:void(0);" class="list-group-item list-group-item-action d-flex align-items-center px-0 py-2">
                        <span class="rounded-dot bg-primary me-2"></span>Remote Control
                    </a>
                    <a href="javascript:void(0);" class="list-group-item list-group-item-action d-flex align-items-center px-0 py-2">
                        <span class="rounded-dot bg-secondary me-2"></span>Google Drive
                    </a>
                    <a href="javascript:void(0);" class="list-group-item list-group-item-action d-flex align-items-center px-0 py-2">
                        <span class="rounded-dot bg-success me-2"></span>FTP Files
                    </a>
                    <a href="javascript:void(0);" class="list-group-item list-group-item-action d-flex align-items-center px-0 py-2">
                        <span class="rounded-dot bg-info me-2"></span>Transfer files
                    </a>
                    <a href="javascript:void(0);" class="list-group-item list-group-item-action d-flex align-items-center px-0 py-2">
                        <span class="rounded-dot bg-warning me-2"></span>Deep Clean
                    </a>
                    <a href="javascript:void(0);" class="list-group-item list-group-item-action d-flex align-items-center px-0 py-2">
                        <span class="rounded-dot bg-danger me-2"></span>Favourities
                    </a>
                    <a href="javascript:void(0);" class="list-group-item list-group-item-action d-flex align-items-center px-0 py-2">
                        <span class="rounded-dot bg-primary me-2"></span>Settings
                    </a>
                </div>
            </div>
        </div>
    </div>
    <div class="col-lg-8 col-xl-9">
        <div class="row mb-3 gap-3">
            <div class="col">
                <div class="gap-3 d-sm-flex">
                    <a href="javascript:void(0);" class="text-nowrap btn btn-primary m-1"><i class="fe fe-plus"></i> Upload New Files</a>
                    <a href="javascript:void(0);" class="text-nowrap btn btn-light m-1"><i class="fe fe-folder"></i> New folder</a>
                </div>
            </div>
            <div class="col col-auto my-auto">
                <div class="input-group">
                    <input type="text" class="form-control border-0" placeholder="Search Files">
                    <button aria-label="button" class="btn btn-light bg-white border-0" type="button"><i class="fe fe-search"></i></button>
                </div>
            </div>
        </div>
        <div class="row">
            @for (item of FileData; track $index) {
                <div class="col-xl-3 col-md-4 col-sm-6">
                    <div class="card border p-0 shadow-none">
                        <div class="d-flex align-items-center px-4 pt-4">
                            <label class="form-check-label">
                                    <input type="checkbox" class="form-check-input" value="option2">
                                </label>
                            <div class="float-end ms-auto">
                                <div ngbDropdown class="btn-group ms-3 mb-0">
                                    <a ngbDropdownToggle aria-label="anchor" href="javascript:void(0);" class="option-dots no-caret" data-bs-toggle="dropdown" aria-expanded="false"><i class="fa fa-ellipsis-v"></i></a>
                                    <div ngbDropdownMenu class="dropdown-menu">
                                        <a class="dropdown-item" href="javascript:void(0);"><i class="fe fe-edit  d-inline-flex me-2"></i> Edit</a>
                                        <a class="dropdown-item" href="javascript:void(0);"><i class="fe fe-share d-inline-flex me-2"></i> Share</a>
                                        <a class="dropdown-item" href="javascript:void(0);"><i class="fe fe-download d-inline-flex me-2"></i> Download</a>
                                        <a class="dropdown-item" href="javascript:void(0);"><i class="fe fe-trash d-inline-flex me-2"></i> Delete</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="card-body pt-0 text-center">
                            <div class="file-manger-icon">
                                <img [src]="item.src" alt="img" class="br-7">
                            </div>
                            <h6 class="mb-1 fw-semibold mt-4">{{item.Category}}</h6>
                            <span class="text-muted">{{item.Size}}</span>
                        </div>
                    </div>
                </div>
            }
           
        </div>
    </div>
</div>
<!-- End Row -->
